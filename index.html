    document.querySelectorAll('[data-rpick]').forEach(el=>el.addEventListener('click',()=>{
      closeModal();startWorkout(el.dataset.rpick,mode);
    }));
  },50);
}

// Flatten the per-exercise sets into the flat log.sets[] shape. entryIndex is
// kept alongside exerciseId so a routine that uses the same exercise twice
// stays reconstructable.
function collectSets(w){
  return w.entries.flatMap((e,ei)=>
    (e.loggedSets||[]).map((s,si)=>({
      exerciseId:e.exerciseId,
      entryIndex:ei,
      setIndex:si,
      reps:s.reps,
      incline:s.incline,
      addedLoad:s.addedLoad||null
    }))
  );
}
function loggedSetCount(w){
  return w?w.entries.reduce((n,e)=>n+(e.loggedSets?.length||0),0):0;
}

async function saveWorkoutLog(w,mode){
  const durationSec=Math.round((Date.now()-w.durationStart)/1000);
  const log={
    date:todayStr(),
    routineId:w.routineId,
    routineName:w.routineName,
    mode,
    sets:mode==='guided'?collectSets(w):[],
    durationSec,
    feltLike:w.feltLike||2
  };
  const id=await dbPut('logs',log);
  log.id=id;
  state.logs.push(log);
  endWorkout();
  return log;
}

// ─── Draft (the set you're about to log) ─────────────
// Defaults to the prescription for set 1, then to whatever you actually did on
// the previous set — if you dropped to 8 reps, set 3 shouldn't jump back to 12.
function draftFor(w){
  const entry=w.entries[w.current];
  if(!entry) return {reps:10,incline:5,load:0};
  if(w.editingSet!=null){
    const s=entry.loggedSets[w.editingSet];
    if(s) return {reps:s.reps,incline:s.incline,load:s.addedLoad||0};
  }
  const prev=entry.loggedSets[entry.loggedSets.length-1];
  return prev
    ? {reps:prev.reps,incline:prev.incline,load:prev.addedLoad||0}
    : {reps:entry.reps,incline:entry.targetIncline,load:0};
}
function ensureDraft(w){
  if(!w.draft) w.draft=draftFor(w);
  return w.draft;
}

function startRest(w){
  const entry=w.entries[w.current];
  const secs=entry?.restSec;
  if(!secs||secs<1){ w.restEnd=null; return; }
  w.restEnd=Date.now()+secs*1000;
  w.restNotified=false;
}
function restRemaining(w){
  if(!w?.restEnd) return null;
  return Math.max(0,Math.ceil((w.restEnd-Date.now())/1000));
}

function renderWorkoutView(){
  const w=state.workout;
  if(!w) return '';

  // ── CHECKOFF mode: scrollable checklist of all exercises ──
  if(w.mode==='checkoff'){
    const feels=[['😊','Easy'],['💪','Medium'],['😤','Hard'],['🔥','Intense'],['🏆','PR Day!']];
    const exRows=w.entries.map((entry,i)=>{
      const ex=EXERCISES.find(e=>e.id===entry.exerciseId);
      if(!ex) return '';
      const done=!!(w.checked?.[i]);
      return `<div class="checkoff-row${done?' checkoff-done':''}" data-chk-row="${i}">
        <button class="check-circle${done?' checked':''}" data-chk-btn="${i}">${done?'✓':''}</button>
        ${exMediaEl(ex,'chk-thumb')||''}
        <div class="chk-info">
          <div class="chk-name">${esc(ex.name)}</div>
          <div class="chk-meta">${entry.sets} sets × ${entry.reps} reps · incline ${entry.targetIncline}</div>
        </div>
      </div>`;
    }).join('');
    return `<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">
      <div style="padding:16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:18px;font-weight:800;font-family:var(--font-head)">${esc(w.routineName)}</div>
          <div id="workout-elapsed" style="font-size:12px;color:var(--fg3);margin-top:3px">⏱ 00:00</div>
        </div>
        <button class="back-btn" id="quit-workout" style="color:var(--red)">Quit</button>
      </div>
      <div style="flex:1;overflow-y:auto;padding:12px 16px">
        <div class="card-section">${exRows}</div>
      </div>
      <div style="padding:16px;border-top:1px solid var(--border);flex-shrink:0">
        <div style="font-size:13px;font-weight:600;color:var(--fg2);margin-bottom:8px">How did it feel?</div>
        <div class="felt-row" style="margin-bottom:12px">${feels.map(([e,l],i)=>`<button class="felt-btn${w.feltLike===(i+1)?' active':''}" data-felt="${i+1}">${e}<br><small>${l}</small></button>`).join('')}</div>
        <button class="btn btn-primary" id="complete-checkoff">✓ Complete Routine</button>
      </div>
    </div>`;
  }

  // ── GUIDED mode: one exercise at a time, logging set by set ──
  const entry=w.entries[w.current];
  const ex=EXERCISES.find(e=>e.id===entry?.exerciseId);
  if(!ex) return '';
  const totalEx=w.entries.length;
  const doneSets=loggedSetCount(w);
  const totalSets=w.entries.reduce((n,e)=>n+(e.sets||0),0);
  const progress=totalSets?Math.min(100,doneSets/totalSets*100).toFixed(0):0;

  const hist=exerciseHistory(entry.exerciseId,1)[0];
  const lastTimeHtml=hist?`
    <div class="last-time">
      <div class="lt-hd">Last time · ${esc(hist.date)}</div>
      <div class="lt-v">${esc(formatSetSummary(hist.sets))}</div>
    </div>`:'';

  return `<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">
    <div style="padding:16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div>
          <div style="font-size:13px;color:var(--fg2);font-weight:600">Exercise ${w.current+1} of ${totalEx}</div>
          <div id="workout-elapsed" style="font-size:12px;color:var(--fg3);margin-top:2px">⏱ 00:00</div>
        </div>
        <button class="back-btn" id="quit-workout" style="color:var(--red)">Quit</button>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div style="font-size:20px;font-weight:800;font-family:var(--font-head);margin-top:10px">${esc(ex.name)}</div>
      <div style="font-size:13px;color:var(--fg2)">${esc(ex.muscleGroup)} · target ${entry.sets} × ${entry.reps} · incline ${entry.targetIncline}</div>
    </div>
    <div style="flex:1;overflow-y:auto;padding:16px">
      ${exMediaEl(ex,null,'width:100%;max-height:220px;object-fit:contain;border-radius:var(--radius);background:var(--bg3);margin-bottom:14px')||''}
      ${lastTimeHtml}
      ${(ex.formCues||[]).map((c,ci)=>`<div class="cue-item"><div class="cue-num">${ci+1}</div><div>${esc(c)}</div></div>`).join('')}
    </div>
    <div id="wk-footer" style="padding:12px 16px 16px;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg2)">
      ${renderGuidedFooter(w)}
    </div>
  </div>`;
}

// Footer is rendered on its own so logging a set can refresh just this block —
// a full re-render would restart the exercise video mid-exercise.
function renderGuidedFooter(w){
  const entry=w.entries[w.current];
  if(!entry) return '';
  const logged=entry.loggedSets||[];
  const target=entry.sets||1;
  const d=ensureDraft(w);
  const editing=w.editingSet!=null;
  const setNo=editing?w.editingSet+1:logged.length+1;
  const beyondTarget=!editing&&logged.length>=target;
  const isLastEx=w.current+1>=w.entries.length;

  const pillCount=Math.max(target,logged.length);
  const pills=Array.from({length:pillCount},(_,i)=>{
    const s=logged[i];
    const cls=['set-pill'];
    if(s) cls.push('logged');
    if(editing&&w.editingSet===i) cls.push('editing');
    else if(!editing&&i===logged.length) cls.push('active');
    return `<div class="${cls.join(' ')}" data-set-pill="${i}">
      <div class="sp-n">Set ${i+1}</div>
      <div class="sp-v">${s?esc(s.reps):'—'}</div>
    </div>`;
  }).join('');

  const rem=restRemaining(w);
  const restCls='rest-banner'+(rem==null?'':' on')+(rem===0?' done':'');
  const restTxt=rem==null?'':(rem>0?`Rest ${Math.floor(rem/60)}:${String(rem%60).padStart(2,'0')}`:'Rest done — go');

  return `
    <div id="rest-banner" class="${restCls}">
      <span class="rest-lbl" id="rest-remaining">${restTxt}</span>
      <button id="rest-plus">+15s</button>
      <button id="rest-skip">Skip</button>
    </div>
    <div class="set-pills">${pills}</div>
    <div class="stepper-row">
      <div class="stepper">
        <div class="st-lbl">Reps</div>
        <div class="st-ctl">
          <button data-step="reps:-1">−</button>
          <span class="st-val" id="draft-reps">${d.reps}</span>
          <button data-step="reps:1">+</button>
        </div>
      </div>
      <div class="stepper">
        <div class="st-lbl">Incline</div>
        <div class="st-ctl">
          <button data-step="incline:-1">−</button>
          <span class="st-val" id="draft-incline">${d.incline}</span>
          <button data-step="incline:1">+</button>
        </div>
      </div>
      ${w.showLoad?`
      <div class="stepper">
        <div class="st-lbl">Load</div>
        <div class="st-ctl">
          <button data-step="load:-5">−</button>
          <span class="st-val" id="draft-load">${d.load}</span>
          <button data-step="load:5">+</button>
        </div>
      </div>`:''}
    </div>
    <button class="btn btn-primary" id="log-set">
      ${editing?`✓ Update Set ${setNo}`:`✓ Log Set ${setNo}${beyondTarget?' (extra)':''}`}
    </button>
    ${editing?`<div class="wk-actions"><button class="btn btn-secondary" id="cancel-edit" style="flex:1">Cancel edit</button></div>`
      :`<div class="wk-actions">
          ${w.current>0?`<button class="btn btn-secondary" id="guided-back" style="width:auto;padding:11px 15px">←</button>`:''}
          <button class="btn btn-secondary" id="guided-next" style="flex:1">
            ${isLastEx?'Finish Workout →':'Next Exercise →'}
          </button>
          <button class="btn btn-secondary" id="toggle-load" style="width:auto;padding:11px 13px" aria-label="Toggle added load">${w.showLoad?'−':'+'}⚖</button>
        </div>`}
  `;
}

function refreshGuidedFooter(){
  const el=document.getElementById('wk-footer');
  if(!el||!state.workout) return;
  el.innerHTML=renderGuidedFooter(state.workout);
  bindGuidedFooter();
}

function bindGuidedFooter(){
  const w=state.workout;
  if(!w||w.mode!=='guided') return;

  // Steppers mutate the draft in place and repaint one number — a re-render
  // here would restart the video on every tap.
  document.querySelectorAll('[data-step]').forEach(el=>el.addEventListener('click',()=>{
    const [field,delta]=el.dataset.step.split(':');
    const d=ensureDraft(w);
    if(field==='reps') d.reps=Math.max(0,Math.min(1000,d.reps+parseInt(delta)));
    if(field==='incline') d.incline=Math.max(1,Math.min(10,d.incline+parseInt(delta)));
    if(field==='load') d.load=Math.max(0,Math.min(2000,d.load+parseInt(delta)));
    const out=document.getElementById('draft-'+field);
    if(out) out.textContent=d[field];
    saveWorkout();
  }));

  document.getElementById('log-set')?.addEventListener('click',()=>{
    const entry=w.entries[w.current];
    const d=ensureDraft(w);
    const rec={reps:d.reps,incline:d.incline,addedLoad:d.load||null,ts:Date.now()};
    if(w.editingSet!=null){
      entry.loggedSets[w.editingSet]=rec;
      w.editingSet=null;
    }else{
      entry.loggedSets.push(rec);
      startRest(w);          // logging the set IS the "set finished" signal
    }
    w.draft=null;
    saveWorkout();
    refreshGuidedFooter();
  });

  // Tap a logged pill to correct it — mis-taps happen, and a log you can't fix
  // is a log you stop trusting.
  document.querySelectorAll('[data-set-pill]').forEach(el=>el.addEventListener('click',()=>{
    const i=parseInt(el.dataset.setPill);
    const entry=w.entries[w.current];
    if(!entry.loggedSets[i]) return;
    w.editingSet=(w.editingSet===i)?null:i;
    w.draft=null;
    saveWorkout();
    refreshGuidedFooter();
  }));

  document.getElementById('cancel-edit')?.addEventListener('click',()=>{
    w.editingSet=null;w.draft=null;saveWorkout();refreshGuidedFooter();
  });

  document.getElementById('toggle-load')?.addEventListener('click',()=>{
    w.showLoad=!w.showLoad;saveWorkout();refreshGuidedFooter();
  });

  document.getElementById('rest-plus')?.addEventListener('click',()=>{
    if(!w.restEnd) return;
    w.restEnd=Math.max(Date.now(),w.restEnd)+15000;
    w.restNotified=false;
    saveWorkout();updateRestBanner();
  });
  document.getElementById('rest-skip')?.addEventListener('click',()=>{
    w.restEnd=null;w.restNotified=false;saveWorkout();updateRestBanner();
  });

  document.getElementById('guided-next')?.addEventListener('click',()=>{
    if(w.current+1>=w.entries.length){
      w.finished=true;w.restEnd=null;saveWorkout();renderGuidedComplete();
    }else{
      w.current++;w.draft=null;w.editingSet=null;
      startRest(w);          // rest carries across the gap between exercises
      saveWorkout();render();
    }
  });
  document.getElementById('guided-back')?.addEventListener('click',()=>{
    if(w.current===0) return;
    w.current--;w.draft=null;w.editingSet=null;
    saveWorkout();render();
  });
}

// Repaints the rest banner from the wall clock. Never re-renders.
function updateRestBanner(){
  const w=state.workout;
  const banner=document.getElementById('rest-banner');
  if(!banner||!w) return;
  const rem=restRemaining(w);
  const label=document.getElementById('rest-remaining');
  if(rem==null){
    banner.classList.remove('on','done');
    if(label) label.textContent='';
    return;
  }
  banner.classList.add('on');
  banner.classList.toggle('done',rem===0);
  if(label) label.textContent=rem>0
    ? `Rest ${Math.floor(rem/60)}:${String(rem%60).padStart(2,'0')}`
    : 'Rest done — go';
  if(rem===0&&!w.restNotified){
    w.restNotified=true;
    restChime();
    saveWorkout();
    // Deliberately does NOT advance anything: if the timer runs out while
    // you're still setting up, an app that jumps ahead on its own is worse
    // than one that waits for you.
  }
}

function bindWorkout(){
  clearInterval(_workoutTimer);
  const tick=()=>{
    if(!state.workout) return;
    const el=document.getElementById('workout-elapsed');
    if(el){
      const s=Math.floor((Date.now()-state.workout.durationStart)/1000);
      const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
      el.textContent='⏱ '+(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(sec).padStart(2,'0');
    }
    updateRestBanner();
  };
  tick();
  _workoutTimer=setInterval(tick,1000);
  acquireWakeLock();

  document.getElementById('quit-workout')?.addEventListener('click',confirmQuitWorkout);

  // Checkoff mode: checkbox toggles (targeted DOM update — no full re-render needed)
  document.querySelectorAll('[data-chk-btn]').forEach(el=>el.addEventListener('click',()=>{
    const i=parseInt(el.dataset.chkBtn);
    state.workout.checked[i]=!state.workout.checked[i];
    const done=state.workout.checked[i];
    el.textContent=done?'✓':'';
    el.classList.toggle('checked',done);
    const row=document.querySelector(`[data-chk-row="${i}"]`);
    if(row) row.classList.toggle('checkoff-done',done);
    saveWorkout();
  }));
  // Checkoff mode: felt picker (toggle active class without re-render)
  document.querySelectorAll('[data-felt]').forEach(el=>el.addEventListener('click',()=>{
    state.workout.feltLike=parseInt(el.dataset.felt);
    document.querySelectorAll('[data-felt]').forEach(b=>b.classList.toggle('active',b===el));
    saveWorkout();
  }));
  // Checkoff mode: complete routine
  document.getElementById('complete-checkoff')?.addEventListener('click',async()=>{
    await saveWorkoutLog(state.workout,'checkoff');
    showToast('Workout logged! 🎉');nav('today');
  });

  bindGuidedFooter();
}

// Quitting used to throw everything away. Now that guided mode holds real
// per-set data, offer to keep it.
function confirmQuitWorkout(){
  const w=state.workout;
  const n=loggedSetCount(w);
  if(w?.mode!=='guided'||n===0){
    showConfirm('Quit workout?','Your progress will be lost.',()=>{endWorkout();nav('today');});
    return;
  }
  closeModal();
  const exCount=w.entries.filter(e=>e.loggedSets?.length).length;
  const backdrop=document.createElement('div');
  backdrop.className='modal-backdrop';backdrop.id='modal-backdrop';
  // The two safe options sit together, so a mis-tap between them costs
  // nothing; discarding is below a divider and deliberately quiet.
  backdrop.innerHTML=`<div class="modal-sheet">
    <div class="modal-title">End workout?</div>
    <p style="color:var(--fg2);font-size:14px;margin-bottom:18px;text-align:center">You've logged ${n} set${n!==1?'s':''} across ${exCount} exercise${exCount!==1?'s':''}.</p>
    <button class="btn btn-primary" id="quit-save" style="margin-bottom:8px">Save what I did</button>
    <button class="btn btn-secondary" id="quit-cancel">Keep going</button>
    <hr class="sheet-sep">
    <button class="btn btn-danger-quiet" id="quit-discard">Discard ${n} set${n!==1?'s':''}</button>
  </div>`;
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal();});
  document.body.appendChild(backdrop);
  document.getElementById('quit-save').addEventListener('click',async()=>{
    closeModal();
    await saveWorkoutLog(state.workout,'guided');
    showToast('Partial workout saved');nav('today');
  });
  document.getElementById('quit-discard').addEventListener('click',()=>{
    closeModal();endWorkout();nav('today');
  });
  document.getElementById('quit-cancel').addEventListener('click',closeModal);
}

// ── Guided workout end screen (replaces entire #view content) ──
function renderGuidedComplete(){
  const w=state.workout;
  if(!w) return;
  clearInterval(_workoutTimer);
  _workoutTimer=null;
  const feels=[['😊','Easy'],['💪','Medium'],['😤','Hard'],['🔥','Intense'],['🏆','PR Day!']];
  const n=loggedSetCount(w);
  const totalReps=w.entries.reduce((t,e)=>t+(e.loggedSets||[]).reduce((s,x)=>s+(x.reps||0),0),0);
  document.getElementById('view').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:32px 24px">
      <div style="font-size:56px;margin-bottom:12px">🏆</div>
      <div style="font-size:26px;font-weight:800;font-family:var(--font-head);margin-bottom:6px">All Done!</div>
      <div style="color:var(--fg2);margin-bottom:20px;font-size:15px;text-align:center">
        ${w.entries.length} exercise${w.entries.length!==1?'s':''}${n?` · ${n} set${n!==1?'s':''} · ${totalReps} reps`:''}
      </div>
      <div style="font-size:14px;font-weight:600;color:var(--fg2);margin-bottom:10px">How did it feel?</div>
      <div class="felt-row" style="width:100%;max-width:340px">${feels.map(([e,l],i)=>`<button class="felt-btn ${(w.feltLike||2)===(i+1)?'active':''}" data-felt="${i+1}">${e}<br><small>${l}</small></button>`).join('')}</div>
      <div style="width:100%;max-width:340px;margin-top:24px">
        <button class="btn btn-primary" id="complete-routine">✓ Complete Routine</button>
        <button class="btn btn-danger-quiet" id="discard-routine" style="margin-top:6px">Discard workout</button>
      </div>
    </div>`;
  document.querySelectorAll('[data-felt]').forEach(el=>el.addEventListener('click',()=>{
    w.feltLike=parseInt(el.dataset.felt);
    document.querySelectorAll('[data-felt]').forEach(b=>b.classList.toggle('active',b===el));
    saveWorkout();
  }));
  document.getElementById('complete-routine')?.addEventListener('click',async()=>{
    await saveWorkoutLog(w,'guided');
    showToast('Workout logged! 🎉');nav('today');
  });
  document.getElementById('discard-routine')?.addEventListener('click',()=>showConfirm('Discard workout?','Progress will not be saved.',()=>{endWorkout();nav('today');}));
}


// ─── MODAL / TOAST HELPERS ───────────────────────────
function showModal(title,content){
  closeModal();
  const backdrop=document.createElement('div');
  backdrop.className='modal-backdrop';backdrop.id='modal-backdrop';
  backdrop.innerHTML=`<div class="modal-sheet"><div class="modal-title">${title}</div>${content}</div>`;
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal();});
  document.body.appendChild(backdrop);
}

function showModal2(renderFn,sheetId){
  closeModal();
  const backdrop=document.createElement('div');
  backdrop.className='modal-backdrop';backdrop.id='modal-backdrop';
  backdrop.innerHTML=`<div class="modal-sheet" id="${sheetId}"></div>`;
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal();});
  document.body.appendChild(backdrop);
  renderFn();
}

function closeModal(){document.getElementById('modal-backdrop')?.remove();}

function showConfirm(title,msg,onConfirm){
  showModal(title,`<p style="color:var(--fg2);margin-bottom:20px">${msg}</p>
    <button class="btn btn-danger" id="confirm-yes" style="width:100%;margin-bottom:8px">Confirm</button>
    <button class="btn btn-secondary" id="confirm-no" style="width:100%">Cancel</button>`);
  setTimeout(()=>{
    document.getElementById('confirm-yes')?.addEventListener('click',()=>{closeModal();onConfirm();});
    document.getElementById('confirm-no')?.addEventListener('click',closeModal);
  },50);
}

let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

// ─── Bootstrap ───────────────────────────────────────
document.addEventListener('DOMContentLoaded',init);

// Last chance to flush the active workout — on iOS a backgrounded PWA can be
// killed without any further events, and pagehide may be all we get.
window.addEventListener('pagehide',()=>{ if(state.workout) saveWorkout(); });
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ if(state.workout) saveWorkout(); return; }
  // The browser drops the screen wake lock whenever the page is hidden, so
  // coming back from the lock screen or another app has to re-request it.
  if(state.workout) acquireWakeLock();
});

// Safety net: a scrolled body misplaces the bottom bar after rotating on iOS.
window.addEventListener('resize',()=>window.scrollTo(0,0));
window.addEventListener('orientationchange',()=>setTimeout(()=>window.scrollTo(0,0),60));
</script>
