<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tiltboard">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Tiltboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
/* A scrolled BODY is what makes the whole app slide up and misplace the bottom
   bar after rotating on iOS. The app scrolls internally (#view, modals). */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body)}

/* ===== THEMES ===== */
:root{
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-head:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --radius:14px;--radius-sm:10px;--radius-xs:6px;
  --nav-h:60px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:min(env(safe-area-inset-bottom,0px),34px);
  --transition:180ms ease;
}
[data-theme="dark"]{
  --bg:#0f0f0f;--bg2:#1c1c1e;--bg3:#2c2c2e;
  --fg:#f2f2f7;--fg2:#aeaeb2;--fg3:#636366;
  --accent:#f5a623;--accent-dim:rgba(245,166,35,.15);--accent-fg:#000;
  --border:#38383a;--green:#30d158;--red:#ff453a;--blue:#0a84ff;
  --card-shadow:0 2px 12px rgba(0,0,0,.5);
}
[data-theme="light"]{
  --bg:#f2f2f7;--bg2:#fff;--bg3:#e5e5ea;
  --fg:#1c1c1e;--fg2:#6c6c70;--fg3:#aeaeb2;
  --accent:#007aff;--accent-dim:rgba(0,122,255,.1);--accent-fg:#fff;
  --border:#c6c6c8;--green:#34c759;--red:#ff3b30;--blue:#007aff;
  --card-shadow:0 1px 8px rgba(0,0,0,.12);
}
[data-theme="warm"]{
  --bg:#faf7f2;--bg2:#f0ebe1;--bg3:#e6dfd3;
  --fg:#2c2416;--fg2:#6b5e3e;--fg3:#9c8f7a;
  --accent:#c44f2f;--accent-dim:rgba(196,79,47,.1);--accent-fg:#fff;
  --border:#d4c5a9;--green:#4a8c3f;--red:#c44f2f;--blue:#2952a3;
  --card-shadow:0 2px 8px rgba(44,36,22,.12);
  --font-head:Georgia,'Times New Roman',serif;
}
@media(prefers-color-scheme:dark){[data-theme="auto"]{
  --bg:#0f0f0f;--bg2:#1c1c1e;--bg3:#2c2c2e;
  --fg:#f2f2f7;--fg2:#aeaeb2;--fg3:#636366;
  --accent:#f5a623;--accent-dim:rgba(245,166,35,.15);--accent-fg:#000;
  --border:#38383a;--green:#30d158;--red:#ff453a;--blue:#0a84ff;
  --card-shadow:0 2px 12px rgba(0,0,0,.5);
}}
@media(prefers-color-scheme:light){[data-theme="auto"]{
  --bg:#f2f2f7;--bg2:#fff;--bg3:#e5e5ea;
  --fg:#1c1c1e;--fg2:#6c6c70;--fg3:#aeaeb2;
  --accent:#007aff;--accent-dim:rgba(0,122,255,.1);--accent-fg:#fff;
  --border:#c6c6c8;--green:#34c759;--red:#ff3b30;--blue:#007aff;
  --card-shadow:0 1px 8px rgba(0,0,0,.12);
}}

/* ===== LAYOUT ===== */
html,body{background:var(--bg2);margin:0;padding:0}
/* dvh tracks the real viewport through rotations and URL-bar show/hide */
#app{display:flex;flex-direction:column;height:100%;height:100dvh;overflow:hidden;padding-top:var(--safe-t)}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
/* Docked, in-flow bar on desktop — the content area sizes around it automatically */
#nav{flex-shrink:0;height:calc(var(--nav-h) + var(--safe-b));background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:var(--safe-b)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--fg3);font-size:10px;cursor:pointer;padding:6px 4px;transition:color var(--transition)}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:22px;height:22px}
.nav-btn span{font-size:10px;font-weight:500}

/* ===== MOBILE: floating pill nav (adapted from Billy pattern) ===== */
@media (max-width:800px){
  /* Out of flow, so content scrolls underneath the frosted pill */
  #nav{
    position:fixed;
    left:16px;right:16px;
    bottom:max(12px, env(safe-area-inset-bottom, 0px));
    height:var(--nav-h);padding-bottom:0;
    border:1px solid var(--border);
    border-radius:calc(var(--nav-h) / 2);
    background:color-mix(in srgb, var(--bg2) 85%, transparent);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 24px rgba(0,0,0,.28);
    overflow:hidden;
  }
  /* Pill is out of flow — keep the last row clear of it */
  #view{padding-bottom:calc(var(--nav-h) + max(12px, env(safe-area-inset-bottom, 0px)) + 20px)}
  #toast{bottom:calc(var(--nav-h) + max(12px, env(safe-area-inset-bottom, 0px)) + 14px)}
  /* A workout hides the pill, so that reservation would just be dead space
     between the controls and the bottom of the screen. */
  #app.in-workout #view{padding-bottom:var(--safe-b)}
  #app.in-workout #toast{bottom:calc(var(--safe-b) + 20px)}
}

/* ===== HEADER ===== */
.page-header{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2);z-index:50}
.page-title{font-size:28px;font-weight:700;font-family:var(--font-head)}
.hdr-btn{background:var(--bg3);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg2)}

/* ===== CARDS ===== */
.card{background:var(--bg2);border-radius:var(--radius);padding:16px;box-shadow:var(--card-shadow);margin-bottom:12px}
.card-row{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--bg2);border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--transition)}
.card-row:active{background:var(--bg3)}
.card-row:last-child{border-bottom:none}
.card-section{background:var(--bg2);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;box-shadow:var(--card-shadow)}

/* ===== BUTTONS ===== */
button{-webkit-appearance:none;appearance:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:var(--radius-sm);font-size:16px;font-weight:600;border:none;cursor:pointer;transition:opacity var(--transition),transform var(--transition)}
.btn:active{opacity:.8;transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--accent-fg);width:100%}
.btn-secondary{background:var(--bg3);color:var(--fg);width:100%}
.btn-ghost{background:none;color:var(--accent);padding:8px 12px;font-size:15px}
.btn-danger{background:var(--red);color:#fff;width:100%}
/* Destructive, but rare and not the action the user is most likely to want.
   Reads as an escape hatch rather than competing with the primary button. */
.btn-danger-quiet{background:none;color:var(--red);width:100%;font-weight:600}
.modal-sheet .sheet-sep{border:none;border-top:1px solid var(--border);margin:14px 0 10px}
.btn-sm{padding:8px 14px;font-size:14px;border-radius:var(--radius-xs)}

/* ===== INPUTS ===== */
.search-bar{display:flex;align-items:center;background:var(--bg3);border-radius:var(--radius-sm);padding:10px 14px;gap:8px;margin:12px 16px 12px}
.search-bar input{flex:1;background:none;border:none;color:var(--fg);font-size:16px;outline:none}
.search-bar input::placeholder{color:var(--fg3)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--fg2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);padding:11px 14px;color:var(--fg);font-size:16px;outline:none;font-family:inherit}
.field textarea{min-height:72px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
select option{background:var(--bg2)}

/* ===== CHIPS / FILTERS ===== */
.chip-row{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chip-row::-webkit-scrollbar{display:none}
.chip{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--fg2);white-space:nowrap;cursor:pointer;flex-shrink:0}
.chip.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}

/* ===== EXERCISE CARD ===== */
.ex-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--transition)}
.ex-row:active{background:var(--bg3)}
.ex-gif{width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-meta{font-size:12px;color:var(--fg2);margin-top:2px}
.ex-fav{background:none;border:none;font-size:18px;cursor:pointer;color:var(--fg3);padding:4px;flex-shrink:0}
.ex-fav.on{color:#ff9f0a}

/* ===== TAGS ===== */
.tag{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600;background:var(--accent-dim);color:var(--accent);text-transform:capitalize}
.tag+.tag{margin-left:4px}

/* ===== TODAY ===== */
.streak-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100px;height:100px;border-radius:50%;border:4px solid var(--accent);background:var(--accent-dim);flex-shrink:0}
.streak-num{font-size:36px;font-weight:800;font-family:var(--font-head);color:var(--accent);line-height:1}
.streak-lbl{font-size:10px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.5px}
.week-dots{display:flex;gap:10px;margin-top:16px;align-items:center;justify-content:center}
.week-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--fg3)}
.week-dot.done{background:var(--green);border-color:var(--green);color:#fff}
.week-dot.today{border-color:var(--accent)}

/* ===== CALENDAR ===== */
.heatmap{display:flex;flex-wrap:wrap;gap:2px;padding:4px 0}
.hm-cell{width:10px;height:10px;border-radius:2px;background:var(--bg3);flex-shrink:0}
.hm-cell.done{background:var(--accent)}
.hm-cell.hm-today{outline:2px solid var(--accent);outline-offset:1px}
.hm-cell.future{background:transparent}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px}
.month-day{aspect-ratio:1;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--fg2);cursor:pointer;position:relative}
.month-day.worked{background:var(--green);color:#fff;font-weight:700}
.month-day.today-mark{border:2px solid var(--accent)}
.month-day.other{color:var(--fg3);opacity:.4}
.month-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
.month-title{font-size:18px;font-weight:700;font-family:var(--font-head)}

/* ===== WORKOUT ===== */
.workout-header{background:var(--bg2);padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.exercise-block{background:var(--bg2);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;box-shadow:var(--card-shadow)}
.set-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border)}
.set-num{width:28px;height:28px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.set-done .set-num{background:var(--green);color:#fff}
.set-input{width:56px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);padding:6px 8px;text-align:center;color:var(--fg);font-size:15px;font-weight:600;border:none}
.rest-timer{text-align:center;padding:20px;font-size:48px;font-weight:800;color:var(--accent);font-family:var(--font-head)}
.rest-label{text-align:center;color:var(--fg2);margin-top:-12px;margin-bottom:16px;font-size:14px}
.progress-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}

/* ===== GUIDED: PER-SET LOGGING ===== */
/* Rest banner sits above the controls rather than covering the screen — during
   rest you often want to read the next exercise's cues. */
.rest-banner{display:none;align-items:center;gap:8px;background:var(--accent-dim);color:var(--accent);border-radius:var(--radius-sm);padding:7px 10px;margin-bottom:8px;font-size:14px;font-weight:700}
.rest-banner.on{display:flex}
.rest-banner.done{background:var(--green);color:#fff}
.rest-banner .rest-lbl{flex:1}
/* Tinted from currentColor rather than a fixed white — accent-dim is nearly
   white in the light and warm themes, where a translucent white would vanish. */
.rest-banner button{background:color-mix(in srgb, currentColor 14%, transparent);border:1px solid color-mix(in srgb, currentColor 30%, transparent);color:inherit;font:inherit;font-size:13px;font-weight:700;padding:5px 10px;border-radius:var(--radius-xs);cursor:pointer;-webkit-tap-highlight-color:transparent}
.set-pills{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.set-pill{flex:1;min-width:48px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 4px 5px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.set-pill .sp-n{font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.set-pill .sp-v{font-size:15px;font-weight:700;margin-top:1px}
.set-pill.logged{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.set-pill.logged .sp-n{color:var(--accent)}
.set-pill.active{border-color:var(--accent);border-width:2px}
.set-pill.editing{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.set-pill.editing .sp-n{color:var(--accent-fg)}
.stepper-row{display:flex;gap:8px;margin-bottom:8px}
.stepper{flex:1;min-width:0;background:var(--bg3);border-radius:var(--radius-sm);padding:4px 6px 5px}
.stepper .st-lbl{font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.4px;font-weight:700;text-align:center}
.stepper .st-ctl{display:flex;align-items:center;justify-content:space-between;gap:2px;margin-top:1px}
.stepper button{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg2);color:var(--fg);font-size:18px;font-weight:700;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.stepper button:active{background:var(--accent);color:#fff}
.stepper .st-val{font-size:18px;font-weight:800;font-family:var(--font-head);min-width:26px;text-align:center}
.wk-actions{display:flex;gap:8px;margin-top:8px}
.wk-actions .btn{padding:11px 14px;font-size:15px}
#wk-footer .btn-primary{padding:13px}
.last-time{background:var(--bg2);border-radius:var(--radius);padding:10px 13px;margin-bottom:12px;border-left:3px solid var(--accent)}
.last-time .lt-hd{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:3px}
.last-time .lt-v{font-size:15px;font-weight:700}
.hist-row{display:flex;align-items:baseline;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border)}
.hist-row:last-child{border-bottom:none}
.hist-date{font-size:12px;color:var(--fg3);flex-shrink:0;min-width:74px}
.hist-sets{font-size:14px;font-weight:600}

/* ===== MODAL ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;animation:fadein .15s}
.modal-sheet{background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0;padding:20px 20px calc(20px + var(--safe-b));max-height:80vh;overflow-y:auto;width:100%;animation:slideup .2s}
.modal-title{font-size:20px;font-weight:700;font-family:var(--font-head);margin-bottom:16px;text-align:center}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ===== TOAST ===== */
/* Below .modal-backdrop (200): a toast reports an action that already
   finished, so it must never cover the controls of a live dialog. */
#toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);color:var(--fg);padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;z-index:150;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;border:1px solid var(--border)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== MISC ===== */
.divider{height:1px;background:var(--border);margin:4px 0}
.empty-state{text-align:center;padding:60px 24px;color:var(--fg3)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:16px;margin-bottom:20px}
.section-title{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.5px;padding:16px 16px 8px;margin:0}
.danger-zone{border:1px solid var(--red);border-radius:var(--radius);padding:16px;margin-top:8px}
.felt-row{display:flex;gap:8px;justify-content:center;margin:12px 0}
.felt-btn{flex:1;padding:12px 4px;border-radius:var(--radius-sm);border:2px solid var(--border);background:none;font-size:13px;font-weight:600;cursor:pointer;color:var(--fg2)}
.felt-btn.active{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.checkoff-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.checkoff-row:last-child{border-bottom:none}
.checkoff-done .chk-name{text-decoration:line-through;color:var(--fg2)}
.check-circle{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--accent);flex-shrink:0;transition:background .15s,border-color .15s}
.check-circle.checked{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chk-thumb{width:52px;height:52px;object-fit:contain;border-radius:8px;background:var(--bg3);flex-shrink:0}
.chk-info{flex:1;min-width:0}
.chk-name{font-size:15px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk-meta{font-size:13px;color:var(--fg2)}
.back-btn{background:none;border:none;color:var(--accent);font-size:16px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:4px;padding:4px 0}
.detail-gif{width:100%;max-height:280px;object-fit:contain;background:var(--bg3);border-radius:var(--radius) var(--radius) 0 0}
.cue-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:15px;line-height:1.5;color:var(--fg2)}
.cue-item:last-child{border-bottom:none}
.cue-num{width:22px;height:22px;border-radius:50%;background:var(--accent-dim);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.routine-entry{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.routine-entry:last-child{border-bottom:none}
.re-info{flex:1;min-width:0}
.re-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.re-detail{font-size:12px;color:var(--fg2);margin-top:2px}
.re-del{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:4px}
.day-cell{flex:0 0 auto;min-width:88px;background:var(--bg3);border-radius:var(--radius-xs);padding:10px 12px;cursor:pointer;transition:background var(--transition)}
.day-cell:active{background:var(--border)}
.day-label{font-size:12px;font-weight:700;color:var(--fg2);text-transform:uppercase;margin-bottom:4px}
.day-routine{font-size:14px;font-weight:600;color:var(--accent)}
.day-rest{font-size:14px;color:var(--fg3)}
.week-schedule{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 2px 8px}
.week-schedule::-webkit-scrollbar{display:none}
.swipe-hint{text-align:center;font-size:12px;color:var(--fg3);padding:4px 0}
.log-entry{padding:12px 16px;border-bottom:1px solid var(--border)}
.log-entry:last-child{border-bottom:none}
.log-date{font-size:13px;color:var(--fg2)}
.log-name{font-size:15px;font-weight:600;margin:2px 0}
.log-detail{font-size:12px;color:var(--fg3)}
.swipe-row{position:relative;overflow:hidden}
.swipe-row:not(:last-child){border-bottom:1px solid var(--border)}
.swipe-del{position:absolute;right:0;top:0;bottom:0;width:80px;background:var(--red);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;gap:3px;cursor:pointer;user-select:none}
.swipe-content{position:relative;z-index:1;background:var(--bg2);transition:transform .22s ease;touch-action:pan-y}
.swipe-content.dragging{transition:none}
.log-del-btn{display:none;background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:6px 8px;border-radius:var(--radius-xs);opacity:.5;flex-shrink:0;line-height:1}
.log-del-btn:hover{opacity:1;background:rgba(255,59,48,.1)}
@media(hover:hover) and (pointer:fine){.log-del-btn{display:block}}
.feel-emoji{font-size:16px}
.custom-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.cue-edit-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.cue-edit-row .cue-num{margin-top:10px;flex-shrink:0}
.cue-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);padding:9px 12px;color:var(--fg);font-size:15px;outline:none;font-family:inherit;resize:vertical;min-height:44px}
.cue-input:focus{border-color:var(--accent)}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:var(--radius-xs);line-height:1;font-size:16px}
.exp-check-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent}
.exp-check-row:last-child{border-bottom:none}
.exp-check-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <div id="view"><div class="empty-state" style="height:100vh;display:flex;align-items:center;justify-content:center"><div><div style="font-size:40px;margin-bottom:12px">🏋️</div><p>Loading Tiltboard…</p></div></div></div>
  <nav id="nav"></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ====================================================
   TILTBOARD — Single-Page PWA
   ==================================================== */

// ─── Globals ─────────────────────────────────────────
let DB, EXERCISES = [], ROUTINES = [], PROGRAMS = [];
let _workoutTimer = null;
let state = {
  view: 'today', subview: null, subId: null,
  theme: 'dark', activeProgram: null,
  filterGroup: 'All', filterPattern: 'All', filterAttach: 'All', filterFav: false,
  searchQ: '',
  editRoutine: null, editProgram: null, editCustomEx: null,
  workout: null, /* { routineId, mode, entries, checked[], current, durationStart, finished, feltLike } — mirrored to localStorage, see saveWorkout() */
  calDate: new Date(),
  logs: [], settings: {}
};

// Everything the user can type — and everything that can arrive in an imported
// backup — goes through here before it reaches innerHTML. Sharing routines and
// custom exercises as JSON is a headline feature, so an imported string is
// untrusted input, not our own data.
const ESC_MAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(v){
  if(v==null) return '';
  return String(v).replace(/[&<>"']/g,c=>ESC_MAP[c]);
}

function nav(view, subview=null, subId=null){
  // If entering workout, don't push regular nav
  state.view=view; state.subview=subview; state.subId=subId;
  render();
  window.scrollTo?.(0,0);
  document.getElementById('view')?.scrollTo(0,0);
}

// ─── IndexedDB ───────────────────────────────────────
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('tiltboard',3);
    r.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('routines')) db.createObjectStore('routines',{keyPath:'id'});
      if(!db.objectStoreNames.contains('programs')) db.createObjectStore('programs',{keyPath:'id'});
      if(!db.objectStoreNames.contains('logs')) db.createObjectStore('logs',{keyPath:'id',autoIncrement:true});
      if(!db.objectStoreNames.contains('userEx')) db.createObjectStore('userEx',{keyPath:'id'});
      // Recreate settings store with keyPath so dbPut works correctly
      if(db.objectStoreNames.contains('settings')) db.deleteObjectStore('settings');
      db.createObjectStore('settings',{keyPath:'id'});
    };
    r.onsuccess = e=>{DB=e.target.result;res(DB)};
    r.onerror = ()=>rej(r.error);
  });
}
function dbGetAll(store){return new Promise((res,rej)=>{const tx=DB.transaction(store,'readonly');const req=tx.objectStore(store).getAll();req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function dbPut(store,val){return new Promise((res,rej)=>{const tx=DB.transaction(store,'readwrite');const req=tx.objectStore(store).put(val);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function dbDelete(store,key){return new Promise((res,rej)=>{const tx=DB.transaction(store,'readwrite');const req=tx.objectStore(store).delete(key);req.onsuccess=()=>res();req.onerror=()=>rej(req.error)})}
function dbGet(store,key){return new Promise((res,rej)=>{const tx=DB.transaction(store,'readonly');const req=tx.objectStore(store).get(key);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}

// ─── Init ────────────────────────────────────────────
async function init(){
  applyTheme(localStorage.getItem('tiltboard-theme') || 'dark');
  await openDB();
  // Load exercises
  const r = await fetch('data/exercises.json'); EXERCISES = await r.json();
  // Load user exercise overrides (favorites) and custom exercises
  const userEx = await dbGetAll('userEx');
  userEx.forEach(u=>{
    if(u.isCustom){ EXERCISES.push(u); }
    else{ const ex=EXERCISES.find(e=>e.id===u.id); if(ex) Object.assign(ex,u); }
  });
  // Load routines (merge starter + user-saved)
  const starterR = await (await fetch('data/routines.json')).json();
  const savedR = await dbGetAll('routines');
  const savedIds = new Set(savedR.map(r=>r.id));
  ROUTINES = [...starterR.filter(r=>!savedIds.has(r.id)), ...savedR];
  // Load programs
  const starterP = await (await fetch('data/programs.json')).json();
  const savedP = await dbGetAll('programs');
  const savedPIds = new Set(savedP.map(p=>p.id));
  PROGRAMS = [...starterP.filter(p=>!savedPIds.has(p.id)), ...savedP];
  // Load logs
  state.logs = await dbGetAll('logs');
  // Load settings
  const settings = await dbGet('settings','main') || {};
  state.settings = settings;
  state.theme = settings.theme || 'dark';
  state.activeProgram = settings.activeProgram || (PROGRAMS[0]?.id ?? null);
  applyTheme(state.theme);
  // Service worker
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  // iOS install tip
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !navigator.standalone;
  if(isIOS && !settings.iosTipSeen){
    setTimeout(()=>{
      showToast('Tip: tap Share → "Add to Home Screen" to install Tiltboard');
      saveSettings({iosTipSeen:true});
    },3000);
  }
  // Restore an in-progress workout that a reload/eviction interrupted
  const resumed = loadSavedWorkout();
  if(resumed){
    state.workout = resumed;
    state.view = 'workout';
  }
  render();
  if(resumed) showToast('Picked your workout back up where you left off');
}

function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = t==='light'?'#f2f2f7':'#0f0f0f';
  try { localStorage.setItem('tiltboard-theme', t); } catch(e) {}
}
async function saveSettings(patch){
  Object.assign(state.settings,patch);
  await dbPut('settings',{...state.settings, id:'main'});
}

// ─── Streak Logic ────────────────────────────────────
function getMonday(d){const dt=new Date(d);const day=dt.getDay()||7;dt.setDate(dt.getDate()-day+1);dt.setHours(0,0,0,0);return dt}
function dateStr(d){const dt=d||new Date();return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`}
function weekKey(d){return dateStr(getMonday(d))}
function todayStr(){return dateStr(new Date())}

function computeStreaks(logs,weeklyTarget){
  if(!weeklyTarget||weeklyTarget<1) weeklyTarget=1;
  // Group by week, counting DISTINCT DAYS — three logs on one Monday is one
  // day of training, not three, and must not satisfy a 3x/week target.
  const daysByWeek={};
  logs.forEach(l=>{
    if(!l.date) return;
    const wk=weekKey(new Date(l.date+'T12:00:00'));
    (daysByWeek[wk]||(daysByWeek[wk]=new Set())).add(l.date);
  });
  const byWeek={};
  Object.keys(daysByWeek).forEach(wk=>{byWeek[wk]=daysByWeek[wk].size});
  // Build sorted list of completed weeks
  const allWeeks=Object.keys(byWeek).sort();
  if(!allWeeks.length) return {current:0,best:0};
  const completed=allWeeks.filter(w=>byWeek[w]>=weeklyTarget);
  if(!completed.length) return {current:0,best:0};
  // Compute streaks
  let best=0,cur=0;
  let prev=null;
  for(const wk of completed){
    if(!prev){cur=1;}
    else{
      const prevDate=new Date(prev+'T12:00:00');prevDate.setDate(prevDate.getDate()+7);
      const thisDate=new Date(wk+'T12:00:00');
      if(dateStr(prevDate)===dateStr(thisDate)) cur++;
      else cur=1;
    }
    if(cur>best) best=cur;
    prev=wk;
  }
  // Check if current week is still alive (last completed week is this or last week)
  const thisWk=weekKey(new Date());
  const lastWk=new Date(); lastWk.setDate(lastWk.getDate()-7);
  const lastWkKey=weekKey(lastWk);
  const lastCompleted=completed[completed.length-1];
  if(lastCompleted!==thisWk&&lastCompleted!==lastWkKey) cur=0;
  // Current week partial: don't break streak if still possible
  if(lastCompleted===lastWkKey&&(byWeek[thisWk]||0)<weeklyTarget){
    // streak still alive (current week not done yet, grace period)
  }
  return {current:cur,best};
}

function thisWeekWorkouts(){
  const wk=weekKey(new Date());
  // Distinct days, to match computeStreaks — see the note there.
  const days=new Set();
  state.logs.forEach(l=>{
    if(l.date&&weekKey(new Date(l.date+'T12:00:00'))===wk) days.add(l.date);
  });
  return days.size;
}

function todayLog(){return state.logs.find(l=>l.date===todayStr())}

function getActiveProgram(){return PROGRAMS.find(p=>p.id===state.activeProgram)}

function getTodayRoutine(){
  const prog=getActiveProgram();
  if(!prog) return null;
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today=days[new Date().getDay()];
  const rid=prog.schedule[today];
  return rid ? ROUTINES.find(r=>r.id===rid) : null;
}

// ─── Render Shell ────────────────────────────────────
function render(){
  const v=document.getElementById('view');
  const n=document.getElementById('nav');
  if(!v||!n) return;
  n.innerHTML=renderNav();
  // Attach nav handlers
  n.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click',()=>nav(btn.dataset.view));
  });
  if(state.view==='workout'&&state.workout){
    // The mobile nav is a floating pill, so it sits on top of the workout
    // footer's controls. A workout has its own Quit button — hide the pill.
    n.style.display='none';
    document.getElementById('app')?.classList.add('in-workout');
    if(state.workout.finished){renderGuidedComplete();return;}
    v.innerHTML=renderWorkoutView();bindWorkout();return;
  }
  n.style.display='';
  document.getElementById('app')?.classList.remove('in-workout');
  switch(state.view){
    case 'today': v.innerHTML=renderToday(); bindToday(); break;
    case 'calendar': v.innerHTML=renderCalendar(); bindCalendar(); break;
    case 'library':
      if(state.subview==='detail') {v.innerHTML=renderExDetail(state.subId);bindExDetail();}
      else if(state.subview==='add-ex'||state.subview==='edit-ex') {v.innerHTML=renderCustomExEditor();bindCustomExEditor();}
      else {v.innerHTML=renderLibrary(); bindLibrary();}
      break;
    case 'routines':
      if(state.subview==='edit'||state.subview==='new'){v.innerHTML=renderRoutineEditor();bindRoutineEditor();}
      else {v.innerHTML=renderRoutines(); bindRoutines();}
      break;
    case 'programs':
      if(state.subview==='edit'||state.subview==='new'){v.innerHTML=renderProgramEditor();bindProgramEditor();}
      else {v.innerHTML=renderPrograms(); bindPrograms();}
      break;
    case 'settings': v.innerHTML=renderSettings(); bindSettings(); break;
    default: v.innerHTML=renderToday(); bindToday();
  }
}

function renderNav(){
  const tabs=[
    {id:'today',label:'Today',icon:'<path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>'},
    {id:'calendar',label:'Calendar',icon:'<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>'},
    {id:'library',label:'Library',icon:'<path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 6V4m0 14v-2M15 6V4m0 14v-2"/>'},
    {id:'routines',label:'Routines',icon:'<path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>'},
    {id:'programs',label:'Programs',icon:'<path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>'},
  ];
  return tabs.map(t=>`
    <button class="nav-btn ${state.view===t.id?'active':''}" data-view="${t.id}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${t.icon}</svg>
      <span>${t.label}</span>
    </button>`).join('');
}

// ─── TODAY ───────────────────────────────────────────
function renderToday(){
  const prog=getActiveProgram();
  const routine=getTodayRoutine();
  const wt=prog?.weeklyTargetN||3;
  const {current,best}=computeStreaks(state.logs,wt);
  const thisWk=thisWeekWorkouts();
  const done=todayLog();
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const todayIdx=(new Date().getDay()+6)%7;
  const dotsHtml=days.map((d,i)=>{
    const logs=state.logs.filter(l=>{
      if(!l.date) return false;
      const ld=new Date(l.date+'T12:00:00');
      const ldd=(ld.getDay()+6)%7;
      return ldd===i && weekKey(ld)===weekKey(new Date());
    });
    const isDone=logs.length>0;
    const isToday=i===todayIdx;
    return `<div class="week-dot ${isDone?'done':''} ${isToday&&!isDone?'today-mark':''}">${d[0]}</div>`;
  }).join('');
  return `
  <div style="padding:20px 16px 0">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <div>
        <div style="font-size:28px;font-weight:800;font-family:var(--font-head)">Today</div>
        <div style="font-size:13px;color:var(--fg2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px">${new Date().toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric'})}</div>
      </div>
      <button class="hdr-btn" id="settings-btn" aria-label="Settings">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </div>
  <div style="padding:16px">
    <div class="card">
      <div style="display:flex;gap:20px;align-items:center">
        <div class="streak-ring">
          <div class="streak-num">${current}</div>
          <div class="streak-lbl">week streak</div>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:18px;font-weight:700;margin-bottom:4px">${thisWk} / ${wt} this week</div>
          <div style="font-size:13px;color:var(--fg2)">Best: ${best} week${best!==1?'s':''}</div>
          <div class="progress-bar" style="margin-top:10px"><div class="progress-fill" style="width:${Math.min(100,thisWk/wt*100)}%"></div></div>
        </div>
      </div>
      <div class="week-dots" style="margin-top:14px;justify-content:space-between">${dotsHtml}</div>
    </div>
    ${routine ? `
    <div class="card">
      <div style="font-size:13px;color:var(--fg2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Today's Workout</div>
      <div style="font-size:20px;font-weight:700;font-family:var(--font-head);margin-bottom:4px">${esc(routine.name)}</div>
      <div style="font-size:14px;color:var(--fg2);margin-bottom:14px">${routine.entries.length} exercises · ${esc(routine.description)}</div>
      ${done ? `<div style="background:var(--green);color:#fff;border-radius:var(--radius-sm);padding:12px;text-align:center;font-weight:600">✓ Completed today!</div>` : `
      <button class="btn btn-primary" id="start-guided" data-rid="${routine.id}">Start Guided Workout</button>
      <button class="btn btn-secondary" id="start-checkoff" data-rid="${routine.id}" style="margin-top:8px">Quick Check-Off</button>
      `}
    </div>` : `
    <div class="card">
      <div style="font-size:16px;font-weight:600;margin-bottom:6px">${prog?'Rest Day 😴':'No Program Active'}</div>
      <div style="font-size:14px;color:var(--fg2);margin-bottom:14px">${prog?'No workout scheduled today.':'Set an active program to see your schedule here.'}</div>
      <button class="btn btn-secondary" id="free-checkoff">Log a Workout Anyway</button>
    </div>`}
    ${state.logs.length>0 ? `
    <div style="font-size:15px;font-weight:700;margin:8px 0 10px">Recent Activity</div>
    <div class="card-section">${[...state.logs].reverse().slice(0,5).map(renderLogRow).join('')}</div>
    `:''}
  </div>`;
}

function renderLogRow(l){
  const r=ROUTINES.find(r=>r.id===l.routineId);
  const feels=['','😊','💪','😤','🔥','🏆'];
  return `<div class="swipe-row" data-logid="${l.id}">
    <div class="swipe-del" aria-label="Delete workout">🗑<span>Delete</span></div>
    <div class="swipe-content log-entry" style="display:flex;align-items:center">
      <div style="flex:1;min-width:0">
        <div class="log-date">${esc(l.date)} · ${l.mode==='guided'?'Guided':'Check-off'} ${l.feltLike?feels[l.feltLike]:''}</div>
        <div class="log-name">${esc(r?.name||l.routineName||'Workout')}</div>
        <div class="log-detail">${[l.sets?.length?l.sets.length+' sets':'',l.durationSec?formatDur(l.durationSec):''].filter(Boolean).join(' · ')}</div>
      </div>
      <button class="log-del-btn" data-logid="${l.id}" aria-label="Delete workout">🗑</button>
    </div>
  </div>`;
}

function formatDur(s){const m=Math.floor(s/60);return m>0?m+'m '+(s%60)+'s':s+'s'}

function bindToday(){
  document.getElementById('settings-btn')?.addEventListener('click',()=>nav('settings'));
  document.getElementById('start-guided')?.addEventListener('click',e=>startWorkout(e.target.dataset.rid,'guided'));
  document.getElementById('start-checkoff')?.addEventListener('click',e=>startWorkout(e.target.dataset.rid,'checkoff'));
  document.getElementById('free-checkoff')?.addEventListener('click',()=>showWorkoutModePicker());
  bindSwipeRows();
}

function bindSwipeRows(){
  document.querySelectorAll('.swipe-row').forEach(row=>{
    const content=row.querySelector('.swipe-content');
    const delBtn=row.querySelector('.swipe-del');
    if(!content||!delBtn) return;
    const SNAP=80;
    let startX=0,startY=0,curX=0,tracking=false,open=false;

    content.addEventListener('touchstart',e=>{
      startX=e.touches[0].clientX; startY=e.touches[0].clientY;
      curX=open?-SNAP:0; tracking=false;
      content.classList.add('dragging');
    },{passive:true});

    content.addEventListener('touchmove',e=>{
      const dx=e.touches[0].clientX-startX;
      const dy=e.touches[0].clientY-startY;
      if(!tracking){
        if(Math.abs(dy)>Math.abs(dx)) return; // let vertical scroll win
        tracking=true;
      }
      curX=Math.max(-SNAP-10, Math.min(0, (open?-SNAP:0)+dx));
      content.style.transform=`translateX(${curX}px)`;
    },{passive:true});

    content.addEventListener('touchend',()=>{
      content.classList.remove('dragging');
      if(curX<-(SNAP/2)){
        open=true; content.style.transform=`translateX(-${SNAP}px)`;
      } else {
        open=false; content.style.transform='';
      }
    });

    // Tap elsewhere to close any open row
    content.addEventListener('click',()=>{ if(open){open=false;content.style.transform='';} });

    delBtn.addEventListener('click',()=>deleteLog(row.dataset.logid));

    // Mouse-device inline delete button (only rendered on hover:hover devices)
    row.querySelector('.log-del-btn')?.addEventListener('click',e=>{
      e.stopPropagation();deleteLog(row.dataset.logid);
    });
  });
}

async function deleteLog(rawId){
  const id=isNaN(rawId)?rawId:parseInt(rawId);
  await dbDelete('logs',id);
  state.logs=state.logs.filter(l=>l.id!=id);
  render();
}

function renderCalendar(){
  return `

function renderHeatmap(){
  const prog=getActiveProgram();
  const {current,best}=computeStreaks(state.logs,prog?.weeklyTargetN||3);

  // Build a log-date lookup for O(1) access
  const logMap={};
  state.logs.forEach(l=>{logMap[l.date]=(logMap[l.date]||0)+1;});

  const today=new Date(); today.setHours(12,0,0,0);
  const todayDs=dateStr(today);

  // Start exactly 364 days ago (gives 365 total dots incl. today)
  const cells=[];
  const start=new Date(today); start.setDate(today.getDate()-364);
  const cursor=new Date(start);
  while(cursor<=today){
    const ds=dateStr(cursor);
    const done=(logMap[ds]||0)>0;
    const isToday=ds===todayDs;
    cells.push(`<div class="hm-cell${done?' done':''}${isToday?' hm-today':''}" title="${ds}${done?' · workout logged':''}"></div>`);
    cursor.setDate(cursor.getDate()+1);
  }

  return `
    <div style="display:flex;gap:24px;margin-bottom:14px">
      <div><div style="font-size:32px;font-weight:800;color:var(--accent)">${current}</div><div style="font-size:12px;color:var(--fg2)">Week Streak</div></div>
      <div><div style="font-size:32px;font-weight:800">${best}</div><div style="font-size:12px;color:var(--fg2)">Best</div></div>
      <div><div style="font-size:32px;font-weight:800">${state.logs.length}</div><div style="font-size:12px;color:var(--fg2)">Total</div></div>
    </div>
    <div class="heatmap">${cells.join('')}</div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:8px;margin-bottom:20px;font-size:12px;color:var(--fg3)">
      <div class="hm-cell" style="width:10px;height:10px;flex-shrink:0"></div><span>Rest day</span>
      <div class="hm-cell done" style="width:10px;height:10px;flex-shrink:0;margin-left:8px"></div><span>Workout</span>
    </div>
    <div style="border-top:1px solid var(--border);margin:0 -16px;padding:0 16px">
      ${renderMonthView()}
    </div>`;
}

function renderMonthView(){
  const d=new Date(state.calDate); d.setDate(1); d.setHours(12,0,0,0);
  const month=d.getMonth(); const year=d.getFullYear();
  const monthName=d.toLocaleDateString('en',{month:'long',year:'numeric'});
  const firstDay=(d.getDay()+6)%7; // 0=Mon
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=todayStr();
  let cells='<div class="month-day" style="font-weight:700;color:var(--fg2)">M</div><div class="month-day" style="font-weight:700;color:var(--fg2)">T</div><div class="month-day" style="font-weight:700;color:var(--fg2)">W</div><div class="month-day" style="font-weight:700;color:var(--fg2)">T</div><div class="month-day" style="font-weight:700;color:var(--fg2)">F</div><div class="month-day" style="font-weight:700;color:var(--fg2)">S</div><div class="month-day" style="font-weight:700;color:var(--fg2)">S</div>';
  for(let i=0;i<firstDay;i++) cells+=`<div class="month-day other"></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const worked=state.logs.some(l=>l.date===ds);
    cells+=`<div class="month-day ${worked?'worked':''} ${ds===today?'today-mark':''}" data-date="${ds}">${day}</div>`;
  }
  return `
    <div class="month-nav">
      <button class="btn-ghost btn" id="cal-prev">← Prev</button>
      <div class="month-title">${monthName}</div>
      <button class="btn-ghost btn" id="cal-next">Next →</button>
    </div>
    <div class="month-grid">${cells}</div>`;
}

function bindCalendar(){
  document.getElementById('cal-prev')?.addEventListener('click',()=>{state.calDate=new Date(state.calDate.getFullYear(),state.calDate.getMonth()-1,1);render()});
  document.getElementById('cal-next')?.addEventListener('click',()=>{state.calDate=new Date(state.calDate.getFullYear(),state.calDate.getMonth()+1,1);render()});
  document.querySelectorAll('.month-day[data-date]').forEach(el=>{

      const dayLogs=state.logs.filter(l=>l.date===ds);

}

function showDayModal(ds,logs){

  document.getElementById('lib-search')?.addEventListener('input',e=>{

  });

  document.getElementById('new-exercise')?.addEventListener('click',()=>{
    state.editCustomEx={id:'',name:'',muscleGroup:'Chest',movementPattern:'push',attachment:'none',gifFile:null,videoFile:null,formCues:[''],favorite:false};
    nav('library','add-ex');
  });
  document.querySelectorAll('[data-grp]').forEach(el=>el.addEventListener('click',()=>{state.filterGroup=el.dataset.grp;render()}));
  document.querySelectorAll('[data-pat]').forEach(el=>el.addEventListener('click',()=>{state.filterPattern=el.dataset.pat;render()}));
  document.querySelectorAll('[data-fav]').forEach(el=>el.addEventListener('click',async e=>{
    e.stopPropagation();
    const ex=EXERCISES.find(x=>x.id===el.dataset.fav);
    if(ex){ex.favorite=!ex.favorite;await dbPut('userEx',{id:ex.id,favorite:ex.favorite});render();}
  }));
  document.querySelectorAll('.ex-row').forEach(el=>el.addEventListener('click',()=>nav('library','detail',el.dataset.exid)));

  const libObserver=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const vid=entry.target;
      if(entry.isIntersecting){
        if(!vid.src && vid.dataset.src) vid.src=vid.dataset.src;
        vid.play().catch(()=>{});
      } else {
        vid.pause();
      }
    });
  },{threshold:0.1});
  document.querySelectorAll('.ex-row video[data-src], .ex-row video[src]').forEach(v=>libObserver.observe(v));

  // Paused videos still hold their decoded buffers. Scrolling the whole list
  // otherwise pins ~85 clips in memory, which is what gets a PWA jetsammed on
  // iOS — drop the source once a clip is well outside the viewport.
  const libUnloader=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const vid=entry.target;
      if(!entry.isIntersecting && vid.src && vid.dataset.src){
        vid.removeAttribute('src');
        vid.load();
      }
    });
  },{rootMargin:'600px'});
  document.querySelectorAll('.ex-row video[data-src]').forEach(v=>libUnloader.observe(v));
}

  document.getElementById('cex-save')?.addEventListener('click',async()=>{
    syncCustomExCues();

    if(!name){showToast('Please enter a name');return;}

    state.editCustomEx=null;
    showToast(isNew?'Exercise added!':'Exercise saved!');
    nav('library');
  });

  // Delete
  document.getElementById('cex-delete')?.addEventListener('click',()=>{
    showConfirm('Delete exercise?',`"${ex.name}" will be permanently deleted.`,async()=>{
      await dbDelete('userEx',ex.id);
      const idx=EXERCISES.findIndex(e=>e.id===ex.id);
      if(idx>=0) EXERCISES.splice(idx,1);
      ROUTINES.forEach(r=>{r.entries=(r.entries||[]).filter(e=>e.exerciseId!==ex.id);});
      state.editCustomEx=null;
      showToast('Exercise deleted');
      nav('library');
    });
  });
}

function showExercisePicker(){
  let searchVal='';
  let groupFilter='All';

  function getFiltered(){
    return EXERCISES
      .filter(e=>!searchVal||e.name.toLowerCase().includes(searchVal.toLowerCase()))
      .filter(e=>groupFilter==='All'||e.muscleGroup===groupFilter);
  }

  let pickerObserver=null;

  function updateList(){
    const list=document.getElementById('picker-ex-list');
    if(!list) return;
    if(pickerObserver){pickerObserver.disconnect();pickerObserver=null;}
    const rows=getFiltered().map(e=>`
      <div class="ex-row picker-ex" data-exid="${esc(e.id)}">
        ${exMediaEl(e,'ex-gif','width:40px;height:40px',true)||''}
        <div class="ex-info"><div class="ex-name">${esc(e.name)}</div><div class="ex-meta">${esc(e.muscleGroup)}</div></div>
      </div>`).join('');
    list.innerHTML=rows||'<div style="padding:16px;text-align:center;color:var(--fg3)">No exercises match.</div>';
    list.querySelectorAll('.picker-ex').forEach(el=>el.addEventListener('click',()=>{
      showExEntryModal(el.dataset.exid); // showModal inside already closes the picker
    }));
    const vids=list.querySelectorAll('video[data-src],video[src]');
    if(vids.length){
      pickerObserver=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          const vid=entry.target;
          if(entry.isIntersecting){
            if(!vid.src&&vid.dataset.src) vid.src=vid.dataset.src;
            vid.play().catch(()=>{});
          } else {
            vid.pause();
          }
        });
      },{root:list,threshold:0.1});
      vids.forEach(v=>pickerObserver.observe(v));
    }
  }

  function updateChips(){
    const chips=document.getElementById('picker-chips');
    if(!chips) return;
    chips.innerHTML=GROUPS.map(g=>`<button class="chip ${groupFilter===g?'active':''}" data-grp="${g}">${g}</button>`).join('');
    chips.querySelectorAll('[data-grp]').forEach(el=>el.addEventListener('click',()=>{
      groupFilter=el.dataset.grp; updateChips(); updateList();
    }));
  }

  // Build modal once — search input is never replaced, so focus is never lost
  closeModal();
  const backdrop=document.createElement('div');
  backdrop.className='modal-backdrop'; backdrop.id='modal-backdrop';
  backdrop.innerHTML=`<div class="modal-sheet">
    <div class="modal-title">Add Exercise</div>
    <div class="search-bar" style="margin:0 0 12px">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="picker-search" type="search" placeholder="Search…" autocomplete="off">
    </div>
    <div class="chip-row" id="picker-chips" style="margin:0 0 8px;padding:0"></div>
    <div class="card-section" id="picker-ex-list" style="height:45vh;overflow-y:auto"></div>
  </div>`;
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal();});
  document.body.appendChild(backdrop);

  document.getElementById('picker-search').addEventListener('input',e=>{
    searchVal=e.target.value; updateList();
  });

  updateChips();
  updateList();
}

      <label class="exp-check-row"><input type="checkbox" id="exp-logs" checked><span style="font-size:15px">Workout History</span></label>
      <label class="exp-check-row"><input type="checkbox" id="exp-custom" checked><span style="font-size:15px">Custom Exercises</span></label>
      <label class="exp-check-row"><input type="checkbox" id="exp-routines" checked><span style="font-size:15px">Routines</span></label>
      <label class="exp-check-row"><input type="checkbox" id="exp-programs" checked><span style="font-size:15px">Programs</span></label>
    </div>
    <p style="font-size:12px;color:var(--fg3);margin-bottom:14px">Tip: share just Routines or Custom Exercises with friends — they can import without overwriting their own data.</p>
    <button class="btn btn-primary" id="exp-go">↓ Download Backup</button>
  `);
  setTimeout(()=>{
    document.getElementById('exp-go')?.addEventListener('click',async()=>{
      const opts={
        incLogs:!!document.getElementById('exp-logs')?.checked,
        incCustom:!!document.getElementById('exp-custom')?.checked,
        incRoutines:!!document.getElementById('exp-routines')?.checked,
        incPrograms:!!document.getElementById('exp-programs')?.checked
      };
      closeModal();
      await doExport(opts);
    });

}

async function doExport({incLogs=true,incCustom=true,incRoutines=true,incPrograms=true}={}){
  const allUserEx=await dbGetAll('userEx');
  const customEx=allUserEx.filter(u=>u.isCustom);
  const favOverrides=allUserEx.filter(u=>!u.isCustom);
  // schema 3 adds populated log.sets[] (per-set reps/incline/load from guided
  // mode). Purely additive — schema 2 files import unchanged, and older app
  // builds accept a 3 file because they only check `schema >= 1`.
  const data={schema:3,version:'1.1',exportedAt:new Date().toISOString()};
  if(incLogs) data.logs=state.logs;
  if(incCustom) data.customExercises=customEx;
  if(incRoutines) data.routines=ROUTINES.filter(r=>!r.isStarter);
  if(incPrograms) data.programs=PROGRAMS.filter(p=>!p.isStarter);
  data.userExerciseOverrides=favOverrides;
  data.settings=state.settings;
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`tiltboard-backup-${todayStr()}.json`;a.click();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded!');
}

// ─── Import sanitising ───────────────────────────────
// A backup can come from a friend, so treat every field as untrusted: keep the
// shape the app expects, drop anything it doesn't, and clamp numbers into the
// ranges the UI can actually render.
const THEMES=['dark','light','warm','auto'];
function sInt(v,min,max,dflt){
  const n=parseInt(v);
  if(!Number.isFinite(n)) return dflt;
  return Math.min(max,Math.max(min,n));
}
function sStr(v,maxLen=200){
  if(typeof v!=='string') return '';
  return v.slice(0,maxLen);
}
function isDateStr(v){return typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)}

function sanitizeSet(s){
  if(!s||typeof s!=='object') return null;
  return {
    exerciseId:sStr(s.exerciseId,120),
    entryIndex:sInt(s.entryIndex,0,999,0),
    setIndex:sInt(s.setIndex,0,999,0),
    reps:sInt(s.reps,0,1000,0),
    incline:sInt(s.incline,1,10,5),
    addedLoad:s.addedLoad==null?null:sInt(s.addedLoad,0,2000,0)
  };
}
function sanitizeLog(l){
  if(!l||typeof l!=='object'||!isDateStr(l.date)) return null;
  const out={
    date:l.date,
    routineId:sStr(l.routineId,120),
    routineName:sStr(l.routineName,120),
    mode:l.mode==='guided'?'guided':'checkoff',
    sets:Array.isArray(l.sets)?l.sets.map(sanitizeSet).filter(Boolean):[],
    durationSec:sInt(l.durationSec,0,86400,0),
    feltLike:sInt(l.feltLike,1,5,2)
  };
  if(Number.isFinite(l.id)) out.id=l.id;
  return out;
}
function sanitizeRoutine(r){
  if(!r||typeof r!=='object'||!sStr(r.id)) return null;
  return {
    id:sStr(r.id,120),
    name:sStr(r.name,120)||'Untitled Routine',
    description:sStr(r.description,500),
    isStarter:!!r.isStarter,
    entries:(Array.isArray(r.entries)?r.entries:[]).map(e=>e&&typeof e==='object'?{
      exerciseId:sStr(e.exerciseId,120),
      sets:sInt(e.sets,1,20,3),
      reps:sInt(e.reps,1,100,10),
      restSec:sInt(e.restSec,0,600,60),
      targetIncline:sInt(e.targetIncline,1,10,5)
    }:null).filter(e=>e&&e.exerciseId)
  };
}
function sanitizeProgram(p){
  if(!p||typeof p!=='object'||!sStr(p.id)) return null;
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const schedule={};
  days.forEach(d=>{schedule[d]=sStr(p.schedule?.[d],120)||null});
  return {
    id:sStr(p.id,120),
    name:sStr(p.name,120)||'Untitled Program',
    description:sStr(p.description,500),
    weeklyTargetN:sInt(p.weeklyTargetN,1,7,3),
    isStarter:!!p.isStarter,
    schedule
  };
}
function sanitizeExercise(e){
  if(!e||typeof e!=='object'||!sStr(e.id)) return null;
  const out={
    id:sStr(e.id,120),
    name:sStr(e.name,120)||'Untitled Exercise',
    muscleGroup:GROUPS.includes(e.muscleGroup)?e.muscleGroup:'Chest',
    movementPattern:PATTERNS.includes(e.movementPattern)?e.movementPattern:'push',
    attachment:ATTACHES.includes(e.attachment)?e.attachment:'none',
    formCues:(Array.isArray(e.formCues)?e.formCues:[]).slice(0,30).map(c=>sStr(c,1000)),
    favorite:!!e.favorite,
    isCustom:!!e.isCustom
  };
  // Media is only ever a same-origin path or a data: URI produced by the editor.
  // Anything else (javascript:, remote URLs) is dropped rather than rendered.
  const okMedia=v=>typeof v==='string'&&(v.startsWith('images/')||v.startsWith('data:image/')||v.startsWith('data:video/'));
  if(okMedia(e.videoFile)) out.videoFile=e.videoFile;
  if(okMedia(e.gifFile)) out.gifFile=e.gifFile;
  return out;
}
function sanitizeSettings(s){
  if(!s||typeof s!=='object') return null;
  const out={};
  if(THEMES.includes(s.theme)) out.theme=s.theme;
  if(typeof s.activeProgram==='string') out.activeProgram=sStr(s.activeProgram,120);
  if(typeof s.iosTipSeen==='boolean') out.iosTipSeen=s.iosTipSeen;
  return Object.keys(out).length?out:null;
}

async function importData(file){
  if(!file) return;
  try{
    const text=await file.text();
    const raw=JSON.parse(text);
    if(!raw||typeof raw!=='object'||!raw.schema||raw.schema<1) throw new Error('Invalid backup file');
    const data={
      schema:raw.schema,
      exportedAt:typeof raw.exportedAt==='string'?raw.exportedAt:'',
      logs:Array.isArray(raw.logs)?raw.logs.map(sanitizeLog).filter(Boolean):null,
      routines:Array.isArray(raw.routines)?raw.routines.map(sanitizeRoutine).filter(Boolean):null,
      programs:Array.isArray(raw.programs)?raw.programs.map(sanitizeProgram).filter(Boolean):null,
      // Anything in this bucket is by definition a custom exercise, whatever the
      // file claims — the flag drives the "custom" badge and the userEx store.
      customExercises:Array.isArray(raw.customExercises)
        ?raw.customExercises.map(e=>{const s=sanitizeExercise(e);return s?{...s,isCustom:true}:null}).filter(Boolean)
        :null,
      userExerciseOverrides:Array.isArray(raw.userExerciseOverrides)
        ?raw.userExerciseOverrides.map(u=>u&&typeof u==='object'&&sStr(u.id)
            ?(u.isCustom?sanitizeExercise(u):{id:sStr(u.id,120),favorite:!!u.favorite})
            :null).filter(Boolean)
        :null,
      settings:sanitizeSettings(raw.settings)
    };
    const parts=[];
    if(data.logs?.length) parts.push(`${data.logs.length} logs`);
    if(data.customExercises?.length) parts.push(`${data.customExercises.length} custom exercises`);
    if(data.routines?.length) parts.push(`${data.routines.length} routines`);
    if(data.programs?.length) parts.push(`${data.programs.length} programs`);
    const msg=`Import ${parts.join(', ')||'data'} from ${esc(data.exportedAt.slice(0,10))||'?'}? Existing matching items will be replaced.`;
    showConfirm('Import Backup?',msg,async()=>{
      // Clear existing user data (only what's present in the file)
      if(data.logs){for(const l of state.logs) if(l.id) await dbDelete('logs',l.id);state.logs=[];}
      if(data.routines){const savedR=await dbGetAll('routines');for(const r of savedR) await dbDelete('routines',r.id);}
      if(data.programs){const savedP=await dbGetAll('programs');for(const p of savedP) await dbDelete('programs',p.id);}
      // Write
      for(const l of (data.logs||[])){const r=await dbPut('logs',l);if(!l.id){l.id=r;}state.logs.push(l);}
      for(const r of (data.routines||[])){await dbPut('routines',r);ROUTINES=ROUTINES.filter(x=>x.id!==r.id);ROUTINES.push(r);}
      for(const p of (data.programs||[])){await dbPut('programs',p);PROGRAMS=PROGRAMS.filter(x=>x.id!==p.id);PROGRAMS.push(p);}
      for(const ce of (data.customExercises||[])){
        await dbPut('userEx',ce);
        const idx=EXERCISES.findIndex(e=>e.id===ce.id);
        if(idx>=0) EXERCISES[idx]=ce; else EXERCISES.push(ce);
      }
      for(const u of (data.userExerciseOverrides||[])){
        if(u.isCustom){const idx=EXERCISES.findIndex(e=>e.id===u.id);if(idx>=0) EXERCISES[idx]=u;else EXERCISES.push(u);}
        else{await dbPut('userEx',u);const ex=EXERCISES.find(e=>e.id===u.id);if(ex)Object.assign(ex,u);}
      }
      if(data.settings){
        await saveSettings(data.settings);
        // theme and activeProgram are mirrored onto state at init, so writing
        // the settings store alone left the running session on the old values
        // until the next manual reload.
        if(data.settings.theme){state.theme=data.settings.theme;applyTheme(state.theme);}
        if(data.settings.activeProgram&&PROGRAMS.some(p=>p.id===data.settings.activeProgram))
          state.activeProgram=data.settings.activeProgram;
      }
      showToast('Import complete!');nav('today');
    });
  }catch(err){showToast('Import failed: '+err.message);}
}

async function forceReload(){
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){console.warn('Cache clear error:',e);}
  location.reload(true);
}

async function resetAll(){
  for(const l of state.logs) if(l.id) await dbDelete('logs',l.id);
  const savedR=await dbGetAll('routines'); for(const r of savedR) await dbDelete('routines',r.id);
  const savedP=await dbGetAll('programs'); for(const p of savedP) await dbDelete('programs',p.id);
  const savedU=await dbGetAll('userEx'); for(const u of savedU) await dbDelete('userEx',u.id);
  state.logs=[];
  ROUTINES=await (await fetch('data/routines.json')).json();
  PROGRAMS=await (await fetch('data/programs.json')).json();
  // Remove custom exercises from memory and reset favorites
  const baseEx=await (await fetch('data/exercises.json')).json();
  EXERCISES.length=0; baseEx.forEach(e=>EXERCISES.push(e));
  state.activeProgram=PROGRAMS[0]?.id||null;
  await dbPut('settings',{id:'main',theme:state.theme,activeProgram:state.activeProgram});
  endWorkout();
  showToast('All data reset!');nav('today');
}

// ─── WORKOUT ─────────────────────────────────────────
// iOS reclaims memory from backgrounded PWAs by killing the web content
// process; coming back re-runs init() from scratch. Everything else lives in
// IndexedDB, so only the active workout was lost. Mirror it into localStorage
// (synchronous, so it survives a kill with no warning) and restore on boot.
const WORKOUT_KEY='tiltboard-active-workout';
const WORKOUT_MAX_AGE_MS=12*60*60*1000;

function saveWorkout(){
  try{
    if(state.workout) localStorage.setItem(WORKOUT_KEY,JSON.stringify(state.workout));
    else localStorage.removeItem(WORKOUT_KEY);
  }catch(e){}
}
function loadSavedWorkout(){
  let w=null;
  try{
    const raw=localStorage.getItem(WORKOUT_KEY);
    if(!raw) return null;
    w=JSON.parse(raw);
  }catch(e){ w=null; }
  const valid=w&&Array.isArray(w.entries)&&w.entries.length&&
              typeof w.durationStart==='number'&&
              Date.now()-w.durationStart<WORKOUT_MAX_AGE_MS;
  if(!valid){ try{localStorage.removeItem(WORKOUT_KEY)}catch(e){} return null; }
  if(!Array.isArray(w.checked)||w.checked.length!==w.entries.length)
    w.checked=Array(w.entries.length).fill(false);
  w.entries.forEach(e=>{if(!Array.isArray(e.loggedSets)) e.loggedSets=[]});
  w.current=Math.min(Math.max(w.current|0,0),w.entries.length-1);
  // restEnd is an absolute timestamp, so a rest that expired while the app was
  // dead simply reads as already-finished — nothing to reconcile.
  if(typeof w.restEnd!=='number') w.restEnd=null;
  if(w.editingSet==null) w.editingSet=null;
  return w;
}
function endWorkout(){
  clearInterval(_workoutTimer);
  _workoutTimer=null;
  state.workout=null;
  releaseWakeLock();
  saveWorkout();
}

// ─── Screen wake lock ────────────────────────────────
// A phone that locks itself between sets is the single most annoying thing a
// workout app can do. The lock is dropped by the browser whenever the page is
// hidden, so it has to be re-acquired on the way back.
let _wakeLock=null;
async function acquireWakeLock(){
  try{
    if(!('wakeLock' in navigator)) return;
    if(_wakeLock) return;
    _wakeLock=await navigator.wakeLock.request('screen');
    _wakeLock.addEventListener?.('release',()=>{_wakeLock=null});
  }catch(e){ _wakeLock=null; }
}
function releaseWakeLock(){
  try{ _wakeLock?.release(); }catch(e){}
  _wakeLock=null;
}

// ─── Rest-timer cues ─────────────────────────────────
// iOS Safari has no navigator.vibrate at all, so vibration alone would leave
// iPhone users with a silent timer. Fall back to a short WebAudio tone, which
// needs an AudioContext unlocked by a real user gesture (workout start).
let _audioCtx=null;
function unlockAudio(){
  if(_audioCtx) return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C) return;
    _audioCtx=new C();
    if(_audioCtx.state==='suspended') _audioCtx.resume();
  }catch(e){ _audioCtx=null; }
}
function restChime(){
  let vibrated=false;
  try{
    if(navigator.vibrate) vibrated=navigator.vibrate([180,90,180]);
  }catch(e){}
  if(vibrated) return;
  try{
    if(!_audioCtx) return;
    if(_audioCtx.state==='suspended') _audioCtx.resume();
    const t=_audioCtx.currentTime;
    [0,0.18].forEach(off=>{
      const osc=_audioCtx.createOscillator();
      const gain=_audioCtx.createGain();
      osc.frequency.value=880;
      gain.gain.setValueAtTime(0.0001,t+off);
      gain.gain.exponentialRampToValueAtTime(0.25,t+off+0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001,t+off+0.14);
      osc.connect(gain);gain.connect(_audioCtx.destination);
      osc.start(t+off);osc.stop(t+off+0.16);
    });
  }catch(e){}
}

// ─── Set history ─────────────────────────────────────
// Reads across saved logs, so it works for any exercise the user has ever
// logged sets against — including from an imported backup.
function exerciseHistory(exerciseId,limit=8){
  return state.logs
    .filter(l=>l.date&&Array.isArray(l.sets)&&l.sets.some(s=>s.exerciseId===exerciseId))
    .sort((a,b)=> a.date<b.date?1 : a.date>b.date?-1 : (b.id||0)-(a.id||0))
    .slice(0,limit)
    .map(l=>({
      date:l.date,
      sets:l.sets.filter(s=>s.exerciseId===exerciseId)
                 .sort((a,b)=>(a.setIndex||0)-(b.setIndex||0))
    }));
}
function formatSetSummary(sets){
  if(!sets.length) return '';
  const reps=sets.map(s=>s.reps).join(' · ');
  const inclines=[...new Set(sets.map(s=>s.incline))];
  const load=sets.find(s=>s.addedLoad);
  return `${reps} @ incline ${inclines.length===1?inclines[0]:inclines.join('/')}`+
         (load?` · +${load.addedLoad}`:'');
}

// ─── Workout lifecycle ───────────────────────────────
function startWorkout(routineId,mode){
  const r=ROUTINES.find(r=>r.id===routineId);
  if(!r) return;
  state.workout={
    routineId,routineName:r.name,mode,
    entries:r.entries.map(e=>({...e,loggedSets:[]})),
    checked:Array(r.entries.length).fill(false),
    current:0,durationStart:Date.now(),
    finished:false,restEnd:null,restNotified:false,
    editingSet:null,draft:null,showLoad:false,feltLike:2
  };
  unlockAudio();      // must ride the tap that started the workout
  acquireWakeLock();
  saveWorkout();
  nav('workout');
}

function showWorkoutModePicker(){
  showModal('Choose Workout Type',`
    <button class="btn btn-primary" id="pick-guided" style="margin-bottom:8px">Start Guided Workout</button>
    <button class="btn btn-secondary" id="pick-checkoff">Quick Check-Off</button>
  `);
  setTimeout(()=>{
    document.getElementById('pick-guided')?.addEventListener('click',()=>{closeModal();showRoutinePicker('guided');});
    document.getElementById('pick-checkoff')?.addEventListener('click',()=>{closeModal();showRoutinePicker('checkoff');});
  },50);
}

function showRoutinePicker(mode){
  const opts=ROUTINES.map(r=>`<div class="card-row" data-rpick="${esc(r.id)}"><div style="flex:1">${esc(r.name)}</div></div>`).join('');
  showModal('Choose a Routine',`<div class="card-section">${opts}</div>`);
