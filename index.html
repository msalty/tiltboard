<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tiltboard">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Tiltboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font-body);overscroll-behavior:none;overflow:hidden}

/* ===== THEMES ===== */
:root{
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-head:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --radius:14px;--radius-sm:10px;--radius-xs:6px;
  --nav-h:60px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:min(env(safe-area-inset-bottom,0px),34px);
  --transition:180ms ease;
}
[data-theme="dark"]{
  --bg:#0f0f0f;--bg2:#1c1c1e;--bg3:#2c2c2e;
  --fg:#f2f2f7;--fg2:#aeaeb2;--fg3:#636366;
  --accent:#f5a623;--accent-dim:rgba(245,166,35,.15);--accent-fg:#000;
  --border:#38383a;--green:#30d158;--red:#ff453a;--blue:#0a84ff;
  --card-shadow:0 2px 12px rgba(0,0,0,.5);
}
[data-theme="light"]{
  --bg:#f2f2f7;--bg2:#fff;--bg3:#e5e5ea;
  --fg:#1c1c1e;--fg2:#6c6c70;--fg3:#aeaeb2;
  --accent:#007aff;--accent-dim:rgba(0,122,255,.1);--accent-fg:#fff;
  --border:#c6c6c8;--green:#34c759;--red:#ff3b30;--blue:#007aff;
  --card-shadow:0 1px 8px rgba(0,0,0,.12);
}
[data-theme="warm"]{
  --bg:#faf7f2;--bg2:#f0ebe1;--bg3:#e6dfd3;
  --fg:#2c2416;--fg2:#6b5e3e;--fg3:#9c8f7a;
  --accent:#c44f2f;--accent-dim:rgba(196,79,47,.1);--accent-fg:#fff;
  --border:#d4c5a9;--green:#4a8c3f;--red:#c44f2f;--blue:#2952a3;
  --card-shadow:0 2px 8px rgba(44,36,22,.12);
  --font-head:Georgia,'Times New Roman',serif;
}
@media(prefers-color-scheme:dark){[data-theme="auto"]{
  --bg:#0f0f0f;--bg2:#1c1c1e;--bg3:#2c2c2e;
  --fg:#f2f2f7;--fg2:#aeaeb2;--fg3:#636366;
  --accent:#f5a623;--accent-dim:rgba(245,166,35,.15);--accent-fg:#000;
  --border:#38383a;--green:#30d158;--red:#ff453a;--blue:#0a84ff;
  --card-shadow:0 2px 12px rgba(0,0,0,.5);
}}
@media(prefers-color-scheme:light){[data-theme="auto"]{
  --bg:#f2f2f7;--bg2:#fff;--bg3:#e5e5ea;
  --fg:#1c1c1e;--fg2:#6c6c70;--fg3:#aeaeb2;
  --accent:#007aff;--accent-dim:rgba(0,122,255,.1);--accent-fg:#fff;
  --border:#c6c6c8;--green:#34c759;--red:#ff3b30;--blue:#007aff;
  --card-shadow:0 1px 8px rgba(0,0,0,.12);
}}

/* ===== LAYOUT ===== */
html,body{background:var(--bg2);margin:0;padding:0}
#app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;overflow:hidden;padding-top:var(--safe-t)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + 8px)}
#nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--fg3);font-size:10px;cursor:pointer;padding:6px 4px;transition:color var(--transition)}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:22px;height:22px}
.nav-btn span{font-size:10px;font-weight:500}

/* ===== iOS SAFE AREA ===== */
@supports (-webkit-touch-callout:none){
  #app{padding-top:env(safe-area-inset-top)}
}

/* ===== HEADER ===== */
.page-header{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2);z-index:50}
.page-title{font-size:28px;font-weight:700;font-family:var(--font-head)}
.hdr-btn{background:var(--bg3);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg2)}

/* ===== CARDS ===== */
.card{background:var(--bg2);border-radius:var(--radius);padding:16px;box-shadow:var(--card-shadow);margin-bottom:12px}
.card-row{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--bg2);border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--transition)}
.card-row:active{background:var(--bg3)}
.card-row:last-child{border-bottom:none}
.card-section{background:var(--bg2);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;box-shadow:var(--card-shadow)}

/* ===== BUTTONS ===== */
button{-webkit-appearance:none;appearance:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:var(--radius-sm);font-size:16px;font-weight:600;border:none;cursor:pointer;transition:opacity var(--transition),transform var(--transition)}
.btn:active{opacity:.8;transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--accent-fg);width:100%}
.btn-secondary{background:var(--bg3);color:var(--fg);width:100%}
.btn-ghost{background:none;color:var(--accent);padding:8px 12px;font-size:15px}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:8px 14px;font-size:14px;border-radius:var(--radius-xs)}

/* ===== INPUTS ===== */
.search-bar{display:flex;align-items:center;background:var(--bg3);border-radius:var(--radius-sm);padding:10px 14px;gap:8px;margin:12px 16px 12px}
.search-bar input{flex:1;background:none;border:none;color:var(--fg);font-size:16px;outline:none}
.search-bar input::placeholder{color:var(--fg3)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--fg2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);padding:11px 14px;color:var(--fg);font-size:16px;outline:none;font-family:inherit}
.field textarea{min-height:72px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
select option{background:var(--bg2)}

/* ===== CHIPS / FILTERS ===== */
.chip-row{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chip-row::-webkit-scrollbar{display:none}
.chip{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--fg2);white-space:nowrap;cursor:pointer;flex-shrink:0}
.chip.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}

/* ===== EXERCISE CARD ===== */
.ex-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--transition)}
.ex-row:active{background:var(--bg3)}
.ex-gif{width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-meta{font-size:12px;color:var(--fg2);margin-top:2px}
.ex-fav{background:none;border:none;font-size:18px;cursor:pointer;color:var(--fg3);padding:4px;flex-shrink:0}
.ex-fav.on{color:#ff9f0a}

/* ===== TAGS ===== */
.tag{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600;background:var(--accent-dim);color:var(--accent);text-transform:capitalize}
.tag+.tag{margin-left:4px}

/* ===== TODAY ===== */
.streak-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100px;height:100px;border-radius:50%;border:4px solid var(--accent);background:var(--accent-dim);flex-shrink:0}
.streak-num{font-size:36px;font-weight:800;font-family:var(--font-head);color:var(--accent);line-height:1}
.streak-lbl{font-size:10px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.5px}
.week-dots{display:flex;gap:10px;margin-top:16px;align-items:center;justify-content:center}
.week-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--fg3)}
.week-dot.done{background:var(--green);border-color:var(--green);color:#fff}
.week-dot.today{border-color:var(--accent)}

/* ===== CALENDAR ===== */
.heatmap{display:flex;flex-wrap:wrap;gap:2px;padding:4px 0}
.hm-cell{width:10px;height:10px;border-radius:2px;background:var(--bg3);flex-shrink:0}
.hm-cell.done{background:var(--accent)}
.hm-cell.hm-today{outline:2px solid var(--accent);outline-offset:1px}
.hm-cell.future{background:transparent}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px}
.month-day{aspect-ratio:1;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--fg2);cursor:pointer;position:relative}
.month-day.worked{background:var(--green);color:#fff;font-weight:700}
.month-day.today-mark{border:2px solid var(--accent)}
.month-day.other{color:var(--fg3);opacity:.4}
.month-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
.month-title{font-size:18px;font-weight:700;font-family:var(--font-head)}

/* ===== WORKOUT ===== */
.workout-header{background:var(--bg2);padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.exercise-block{background:var(--bg2);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;box-shadow:var(--card-shadow)}
.set-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border)}
.set-num{width:28px;height:28px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.set-done .set-num{background:var(--green);color:#fff}
.set-input{width:56px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);padding:6px 8px;text-align:center;color:var(--fg);font-size:15px;font-weight:600;border:none}
.rest-timer{text-align:center;padding:20px;font-size:48px;font-weight:800;color:var(--accent);font-family:var(--font-head)}
.rest-label{text-align:center;color:var(--fg2);margin-top:-12px;margin-bottom:16px;font-size:14px}
.progress-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}

/* ===== MODAL ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;animation:fadein .15s}
.modal-sheet{background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0;padding:20px 20px calc(20px + var(--safe-b));max-height:80vh;overflow-y:auto;width:100%;animation:slideup .2s}
.modal-title{font-size:20px;font-weight:700;font-family:var(--font-head);margin-bottom:16px;text-align:center}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ===== TOAST ===== */
#toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);color:var(--fg);padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;z-index:300;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;border:1px solid var(--border)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== MISC ===== */
.divider{height:1px;background:var(--border);margin:4px 0}
.empty-state{text-align:center;padding:60px 24px;color:var(--fg3)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:16px;margin-bottom:20px}
.section-title{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.5px;padding:16px 16px 8px;margin:0}
.danger-zone{border:1px solid var(--red);border-radius:var(--radius);padding:16px;margin-top:8px}
.felt-row{display:flex;gap:8px;justify-content:center;margin:12px 0}
.felt-btn{flex:1;padding:12px 4px;border-radius:var(--radius-sm);border:2px solid var(--border);background:none;font-size:13px;font-weight:600;cursor:pointer;color:var(--fg2)}
.felt-btn.active{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.checkoff-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.checkoff-row:last-child{border-bottom:none}
.checkoff-done .chk-name{text-decoration:line-through;color:var(--fg2)}
.check-circle{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--accent);flex-shrink:0;transition:background .15s,border-color .15s}
.check-circle.checked{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chk-thumb{width:52px;height:52px;object-fit:contain;border-radius:8px;background:var(--bg3);flex-shrink:0}
.chk-info{flex:1;min-width:0}
.chk-name{font-size:15px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk-meta{font-size:13px;color:var(--fg2)}
.back-btn{background:none;border:none;color:var(--accent);font-size:16px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:4px;padding:4px 0}
.detail-gif{width:100%;max-height:280px;object-fit:contain;background:var(--bg3);border-radius:var(--radius) var(--radius) 0 0}
.cue-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:15px;line-height:1.5;color:var(--fg2)}
.cue-item:last-child{border-bottom:none}
.cue-num{width:22px;height:22px;border-radius:50%;background:var(--accent-dim);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.routine-entry{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.routine-entry:last-child{border-bottom:none}
.re-info{flex:1;min-width:0}
.re-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.re-detail{font-size:12px;color:var(--fg2);margin-top:2px}
.re-del{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:4px}
.day-cell{flex:0 0 auto;min-width:88px;background:var(--bg3);border-radius:var(--radius-xs);padding:10px 12px;cursor:pointer;transition:background var(--transition)}
.day-cell:active{background:var(--border)}
.day-label{font-size:12px;font-weight:700;color:var(--fg2);text-transform:uppercase;margin-bottom:4px}
.day-routine{font-size:14px;font-weight:600;color:var(--accent)}
.day-rest{font-size:14px;color:var(--fg3)}
.week-schedule{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 2px 8px}
.week-schedule::-webkit-scrollbar{display:none}
.swipe-hint{text-align:center;font-size:12px;color:var(--fg3);padding:4px 0}
.log-entry{padding:12px 16px;border-bottom:1px solid var(--border)}
.log-entry:last-child{border-bottom:none}
.log-date{font-size:13px;color:var(--fg2)}
.log-name{font-size:15px;font-weight:600;margin:2px 0}
.log-detail{font-size:12px;color:var(--fg3)}
.swipe-row{position:relative;overflow:hidden}
.swipe-row:not(:last-child){border-bottom:1px solid var(--border)}
.swipe-del{position:absolute;right:0;top:0;bottom:0;width:80px;background:var(--red);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;gap:3px;cursor:pointer;user-select:none}
.swipe-content{position:relative;z-index:1;background:var(--bg2);transition:transform .22s ease;touch-action:pan-y}
.swipe-content.dragging{transition:none}
.log-del-btn{display:none;background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:6px 8px;border-radius:var(--radius-xs);opacity:.5;flex-shrink:0;line-height:1}
.log-del-btn:hover{opacity:1;background:rgba(255,59,48,.1)}
@media(hover:hover) and (pointer:fine){.log-del-btn{display:block}}
.feel-emoji{font-size:16px}
.custom-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.cue-edit-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.cue-edit-row .cue-num{margin-top:10px;flex-shrink:0}
.cue-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);padding:9px 12px;color:var(--fg);font-size:15px;outline:none;font-family:inherit;resize:vertical;min-height:44px}
.cue-input:focus{border-color:var(--accent)}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:var(--radius-xs);line-height:1;font-size:16px}
.exp-check-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent}
.exp-check-row:last-child{border-bottom:none}
.exp-check-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <div id="view"><div class="empty-state" style="height:100vh;display:flex;align-items:center;justify-content:center"><div><div style="font-size:40px;margin-bottom:12px">🏋️</div><p>Loading Tiltboard…</p></div></div></div>
  <nav id="nav"></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ====================================================
   TILTBOARD — Single-Page PWA
   ==================================================== */

// ─── Globals ─────────────────────────────────────────
let DB, EXERCISES = [], ROUTINES = [], PROGRAMS = [];
let _workoutTimer = null;
let state = {
  view: 'today', subview: null, subId: null,
  theme: 'dark', activeProgram: null,
  filterGroup: 'All', filterPattern: 'All', filterAttach: 'All', filterFav: false,
  searchQ: '',
  editRoutine: null, editProgram: null, editCustomEx: null,
  workout: null, /* { routineId, mode, entries, current, sets[], durationStart, restTimer } */
  calDate: new Date(),
  logs: [], settings: {}
};

function nav(view, subview=null, subId=null){
  // If entering workout, don't push regular nav
  state.view=view; state.subview=subview; state.subId=subId;
  render();
  window.scrollTo?.(0,0);
  document.getElementById('view')?.scrollTo(0,0);
}

// ─── IndexedDB ───────────────────────────────────────
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('tiltboard',3);
    r.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('routines')) db.createObjectStore('routines',{keyPath:'id'});
      if(!db.objectStoreNames.contains('programs')) db.createObjectStore('programs',{keyPath:'id'});
      if(!db.objectStoreNames.contains('logs')) db.createObjectStore('logs',{keyPath:'id',autoIncrement:true});
      if(!db.objectStoreNames.contains('userEx')) db.createObjectStore('userEx',{keyPath:'id'});
      // Recreate settings store with keyPath so dbPut works correctly
      if(db.objectStoreNames.contains('settings')) db.deleteObjectStore('settings');
      db.createObjectStore('settings',{keyPath:'id'});
    };
    r.onsuccess = e=>{DB=e.target.result;res(DB)};
    r.onerror = ()=>rej(r.error);
  });
}
function dbGetAll(store){return new Promise((res,rej)=>{const tx=DB.transaction(store,'readonly');const req=tx.objectStore(store).getAll();req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function dbPut(store,val){return new Promise((res,rej)=>{const tx=DB.transaction(store,'readwrite');const req=tx.objectStore(store).put(val);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function dbDelete(store,key){return new Promise((res,rej)=>{const tx=DB.transaction(store,'readwrite');const req=tx.objectStore(store).delete(key);req.onsuccess=()=>res();req.onerror=()=>rej(req.error)})}
function dbGet(store,key){return new Promise((res,rej)=>{const tx=DB.transaction(store,'readonly');const req=tx.objectStore(store).get(key);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}

// ─── Init ────────────────────────────────────────────
async function init(){
  applyTheme(localStorage.getItem('tiltboard-theme') || 'dark');
  await openDB();
  // Load exercises
  const r = await fetch('data/exercises.json'); EXERCISES = await r.json();
  // Load user exercise overrides (favorites) and custom exercises
  const userEx = await dbGetAll('userEx');
  userEx.forEach(u=>{
    if(u.isCustom){ EXERCISES.push(u); }
    else{ const ex=EXERCISES.find(e=>e.id===u.id); if(ex) Object.assign(ex,u); }
  });
  // Load routines (merge starter + user-saved)
  const starterR = await (await fetch('data/routines.json')).json();
  const savedR = await dbGetAll('routines');
  const savedIds = new Set(savedR.map(r=>r.id));
  ROUTINES = [...starterR.filter(r=>!savedIds.has(r.id)), ...savedR];
  // Load programs
  const starterP = await (await fetch('data/programs.json')).json();
  const savedP = await dbGetAll('programs');
  const savedPIds = new Set(savedP.map(p=>p.id));
  PROGRAMS = [...starterP.filter(p=>!savedPIds.has(p.id)), ...savedP];
  // Load logs
  state.logs = await dbGetAll('logs');
  // Load settings
  const settings = await dbGet('settings','main') || {};
  state.settings = settings;
  state.theme = settings.theme || 'dark';
  state.activeProgram = settings.activeProgram || (PROGRAMS[0]?.id ?? null);
  applyTheme(state.theme);
  // Service worker
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  // iOS install tip
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !navigator.standalone;
  if(isIOS && !settings.iosTipSeen){
    setTimeout(()=>{
      showToast('Tip: tap Share → "Add to Home Screen" to install Tiltboard');
      saveSettings({iosTipSeen:true});
    },3000);
  }
  render();
}

function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = t==='light'?'#f2f2f7':'#0f0f0f';
  try { localStorage.setItem('tiltboard-theme', t); } catch(e) {}
}
async function saveSettings(patch){
  Object.assign(state.settings,patch);
  await dbPut('settings',{...state.settings, id:'main'});
}

// ─── Streak Logic ────────────────────────────────────
function getMonday(d){const dt=new Date(d);const day=dt.getDay()||7;dt.setDate(dt.getDate()-day+1);dt.setHours(0,0,0,0);return dt}
function dateStr(d){const dt=d||new Date();return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`}
function weekKey(d){return dateStr(getMonday(d))}
function todayStr(){return dateStr(new Date())}

function computeStreaks(logs,weeklyTarget){
  if(!weeklyTarget||weeklyTarget<1) weeklyTarget=1;
  // Group logs by week
  const byWeek={};
  logs.forEach(l=>{if(l.date){const wk=weekKey(new Date(l.date+'T12:00:00'));byWeek[wk]=(byWeek[wk]||0)+1}});
  // Build sorted list of completed weeks
  const allWeeks=Object.keys(byWeek).sort();
  if(!allWeeks.length) return {current:0,best:0};
  const completed=allWeeks.filter(w=>byWeek[w]>=weeklyTarget);
  if(!completed.length) return {current:0,best:0};
  // Compute streaks
  let best=0,cur=0;
  let prev=null;
  for(const wk of completed){
    if(!prev){cur=1;}
    else{
      const prevDate=new Date(prev+'T12:00:00');prevDate.setDate(prevDate.getDate()+7);
      const thisDate=new Date(wk+'T12:00:00');
      if(dateStr(prevDate)===dateStr(thisDate)) cur++;
      else cur=1;
    }
    if(cur>best) best=cur;
    prev=wk;
  }
  // Check if current week is still alive (last completed week is this or last week)
  const thisWk=weekKey(new Date());
  const lastWk=new Date(); lastWk.setDate(lastWk.getDate()-7);
  const lastWkKey=weekKey(lastWk);
  const lastCompleted=completed[completed.length-1];
  if(lastCompleted!==thisWk&&lastCompleted!==lastWkKey) cur=0;
  // Current week partial: don't break streak if still possible
  if(lastCompleted===lastWkKey&&(byWeek[thisWk]||0)<weeklyTarget){
    // streak still alive (current week not done yet, grace period)
  }
  return {current:cur,best};
}

function thisWeekWorkouts(){
  const wk=weekKey(new Date());
  return state.logs.filter(l=>l.date&&weekKey(new Date(l.date+'T12:00:00'))===wk).length;
}

function todayLog(){return state.logs.find(l=>l.date===todayStr())}

function getActiveProgram(){return PROGRAMS.find(p=>p.id===state.activeProgram)}

function getTodayRoutine(){
  const prog=getActiveProgram();
  if(!prog) return null;
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today=days[new Date().getDay()];
  const rid=prog.schedule[today];
  return rid ? ROUTINES.find(r=>r.id===rid) : null;
}

// ─── Render Shell ────────────────────────────────────
function render(){
  const v=document.getElementById('view');
  const n=document.getElementById('nav');
  if(!v||!n) return;
  n.innerHTML=renderNav();
  // Attach nav handlers
  n.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click',()=>nav(btn.dataset.view));
  });
  if(state.view==='workout'){v.innerHTML=renderWorkoutView();bindWorkout();return;}
  switch(state.view){
    case 'today': v.innerHTML=renderToday(); bindToday(); break;
    case 'calendar': v.innerHTML=renderCalendar(); bindCalendar(); break;
    case 'library':
      if(state.subview==='detail') {v.innerHTML=renderExDetail(state.subId);bindExDetail();}
      else if(state.subview==='add-ex'||state.subview==='edit-ex') {v.innerHTML=renderCustomExEditor();bindCustomExEditor();}
      else {v.innerHTML=renderLibrary(); bindLibrary();}
      break;
    case 'routines':
      if(state.subview==='edit'||state.subview==='new'){v.innerHTML=renderRoutineEditor();bindRoutineEditor();}
      else {v.innerHTML=renderRoutines(); bindRoutines();}
      break;
    case 'programs':
      if(state.subview==='edit'||state.subview==='new'){v.innerHTML=renderProgramEditor();bindProgramEditor();}
      else {v.innerHTML=renderPrograms(); bindPrograms();}
      break;
    case 'settings': v.innerHTML=renderSettings(); bindSettings(); break;
    default: v.innerHTML=renderToday(); bindToday();
  }
}

  document.getElementById('free-checkoff')?.addEventListener('click',()=>showWorkoutModePicker());
  bindSwipeRows();
}

function bindSwipeRows(){
  document.querySelectorAll('.swipe-row').forEach(row=>{
    const content=row.querySelector('.swipe-content');
    const delBtn=row.querySelector('.swipe-del');
    if(!content||!delBtn) return;
    const SNAP=80;
    let startX=0,startY=0,curX=0,tracking=false,open=false;

    content.addEventListener('touchstart',e=>{
      startX=e.touches[0].clientX; startY=e.touches[0].clientY;
      curX=open?-SNAP:0; tracking=false;
      content.classList.add('dragging');
    },{passive:true});

    content.addEventListener('touchmove',e=>{
      const dx=e.touches[0].clientX-startX;
      const dy=e.touches[0].clientY-startY;
      if(!tracking){
        if(Math.abs(dy)>Math.abs(dx)) return; // let vertical scroll win
        tracking=true;
      }
      curX=Math.max(-SNAP-10, Math.min(0, (open?-SNAP:0)+dx));
      content.style.transform=`translateX(${curX}px)`;
    },{passive:true});

    content.addEventListener('touchend',()=>{
      content.classList.remove('dragging');
      if(curX<-(SNAP/2)){
        open=true; content.style.transform=`translateX(-${SNAP}px)`;
      } else {
        open=false; content.style.transform='';
      }
    });

    // Tap elsewhere to close any open row
    content.addEventListener('click',()=>{ if(open){open=false;content.style.transform='';} });

    delBtn.addEventListener('click',()=>deleteLog(row.dataset.logid));

    // Mouse-device inline delete button (only rendered on hover:hover devices)
    row.querySelector('.log-del-btn')?.addEventListener('click',e=>{
      e.stopPropagation();deleteLog(row.dataset.logid);
    });
  });
}

async function deleteLog(rawId){
  const id=isNaN(rawId)?rawId:parseInt(rawId);
  await dbDelete('logs',id);
  state.logs=state.logs.filter(l=>l.id!=id);
  render();
}

function renderCalendar(){
  return `
  <div class="page-header">
    <div class="page-title">Calendar</div>
  </div>
  <div style="padding:8px 16px">
    ${renderHeatmap()}
  </div>`;

function renderHeatmap(){
  const prog=getActiveProgram();
  const {current,best}=computeStreaks(state.logs,prog?.weeklyTargetN||3);

  // Build a log-date lookup for O(1) access
  const logMap={};
  state.logs.forEach(l=>{logMap[l.date]=(logMap[l.date]||0)+1;});

  const today=new Date(); today.setHours(12,0,0,0);
  const todayDs=dateStr(today);

  // Start exactly 364 days ago (gives 365 total dots incl. today)
  const cells=[];
  const start=new Date(today); start.setDate(today.getDate()-364);
  const cursor=new Date(start);
  while(cursor<=today){
    const ds=dateStr(cursor);
    const done=(logMap[ds]||0)>0;
    const isToday=ds===todayDs;
    cells.push(`<div class="hm-cell${done?' done':''}${isToday?' hm-today':''}" title="${ds}${done?' · workout logged':''}"></div>`);
    cursor.setDate(cursor.getDate()+1);
  }

  return `
    <div style="display:flex;gap:24px;margin-bottom:14px">
      <div><div style="font-size:32px;font-weight:800;color:var(--accent)">${current}</div><div style="font-size:12px;color:var(--fg2)">Week Streak</div></div>
      <div><div style="font-size:32px;font-weight:800">${best}</div><div style="font-size:12px;color:var(--fg2)">Best</div></div>
      <div><div style="font-size:32px;font-weight:800">${state.logs.length}</div><div style="font-size:12px;color:var(--fg2)">Total</div></div>
    </div>
    <div class="heatmap">${cells.join('')}</div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:8px;margin-bottom:20px;font-size:12px;color:var(--fg3)">
      <div class="hm-cell" style="width:10px;height:10px;flex-shrink:0"></div><span>Rest day</span>
      <div class="hm-cell done" style="width:10px;height:10px;flex-shrink:0;margin-left:8px"></div><span>Workout</span>
    </div>
    <div style="border-top:1px solid var(--border);margin:0 -16px;padding:0 16px">
      ${renderMonthView()}
    </div>`;
}

function renderMonthView(){
  const d=new Date(state.calDate); d.setDate(1); d.setHours(12,0,0,0);
  const month=d.getMonth(); const year=d.getFullYear();
  const monthName=d.toLocaleDateString('en',{month:'long',year:'numeric'});
  const firstDay=(d.getDay()+6)%7; // 0=Mon
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=todayStr();
  let cells='<div class="month-day" style="font-weight:700;color:var(--fg2)">M</div><div class="month-day" style="font-weight:700;color:var(--fg2)">T</div><div class="month-day" style="font-weight:700;color:var(--fg2)">W</div><div class="month-day" style="font-weight:700;color:var(--fg2)">T</div><div class="month-day" style="font-weight:700;color:var(--fg2)">F</div><div class="month-day" style="font-weight:700;color:var(--fg2)">S</div><div class="month-day" style="font-weight:700;color:var(--fg2)">S</div>';
  for(let i=0;i<firstDay;i++) cells+=`<div class="month-day other"></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const worked=state.logs.some(l=>l.date===ds);
    cells+=`<div class="month-day ${worked?'worked':''} ${ds===today?'today-mark':''}" data-date="${ds}">${day}</div>`;
  }
  return `
    <div class="month-nav">
      <button class="btn-ghost btn" id="cal-prev">← Prev</button>
      <div class="month-title">${monthName}</div>
      <button class="btn-ghost btn" id="cal-next">Next →</button>
    </div>
    <div class="month-grid">${cells}</div>`;
}

function bindCalendar(){
  document.getElementById('cal-prev')?.addEventListener('click',()=>{state.calDate=new Date(state.calDate.getFullYear(),state.calDate.getMonth()-1,1);render()});
  document.getElementById('cal-next')?.addEventListener('click',()=>{state.calDate=new Date(state.calDate.getFullYear(),state.calDate.getMonth()+1,1);render()});
  document.querySelectorAll('.month-day[data-date]').forEach(el=>{
    el.addEventListener('click',()=>{
      const ds=el.dataset.date;
      const dayLogs=state.logs.filter(l=>l.date===ds);
      if(dayLogs.length) showDayModal(ds,dayLogs);
    });
  });
}

function showDayModal(ds,logs){
  const content=logs.map(l=>{
    const r=ROUTINES.find(r=>r.id===l.routineId);
    return `<div class="log-entry"><div class="log-name">${r?.name||'Workout'}</div><div class="log-detail">${l.mode==='guided'?'Guided':'Check-off'}${l.durationSec?' · '+formatDur(l.durationSec):''}</div></div>`;
  }).join('');
  showModal(`Workouts on ${ds}`,`<div class="card-section">${content}</div>`);
}

function exMediaEl(ex,cls,style,lazy){

  if(ex.videoFile){
    if(lazy) return `<video${c}${s} data-src="${ex.videoFile}" muted loop playsinline preload="none"></video>`;
    return `<video${c}${s} src="${ex.videoFile}" autoplay muted loop playsinline></video>`;
  }
  if(ex.gifFile) return `<img${c}${s} src="${ex.gifFile}" alt="${ex.name||''}" loading="lazy">`;
  return null;
}

  if(state.searchQ) exs=exs.filter(e=>e.name.toLowerCase().includes(state.searchQ.toLowerCase()));
  if(state.filterGroup!=='All') exs=exs.filter(e=>e.muscleGroup===state.filterGroup);
  if(state.filterPattern!=='All') exs=exs.filter(e=>e.movementPattern===state.filterPattern);

  if(state.filterFav) exs=exs.filter(e=>e.favorite);
  const groupChips=GROUPS.map(g=>`<button class="chip ${state.filterGroup===g?'active':''}" data-grp="${g}">${g}</button>`).join('');

function bindLibrary(){
  document.getElementById('lib-search')?.addEventListener('input',e=>{
    state.searchQ=e.target.value;
    const pos=e.target.selectionStart;
    render();
    const inp=document.getElementById('lib-search');
    if(inp){inp.focus();inp.setSelectionRange(pos,pos);}
  });
  document.getElementById('fav-toggle')?.addEventListener('click',()=>{state.filterFav=!state.filterFav;render()});
  document.getElementById('new-exercise')?.addEventListener('click',()=>{
    state.editCustomEx={id:'',name:'',muscleGroup:'Chest',movementPattern:'push',attachment:'none',gifFile:null,videoFile:null,formCues:[''],favorite:false};
    nav('library','add-ex');
  });
  document.querySelectorAll('[data-grp]').forEach(el=>el.addEventListener('click',()=>{state.filterGroup=el.dataset.grp;render()}));
  document.querySelectorAll('[data-pat]').forEach(el=>el.addEventListener('click',()=>{state.filterPattern=el.dataset.pat;render()}));
  document.querySelectorAll('[data-fav]').forEach(el=>el.addEventListener('click',async e=>{
    e.stopPropagation();
    const ex=EXERCISES.find(x=>x.id===el.dataset.fav);
    if(ex){ex.favorite=!ex.favorite;await dbPut('userEx',{id:ex.id,favorite:ex.favorite});render();}
  }));
  document.querySelectorAll('.ex-row').forEach(el=>el.addEventListener('click',()=>nav('library','detail',el.dataset.exid)));

  const libObserver=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const vid=entry.target;
      if(entry.isIntersecting){
        if(!vid.src && vid.dataset.src) vid.src=vid.dataset.src;
        vid.play().catch(()=>{});
      } else {
        vid.pause();
      }
    });
  },{threshold:0.1});
  document.querySelectorAll('.ex-row video[data-src], .ex-row video[src]').forEach(v=>libObserver.observe(v));
}

function syncCustomExCues(){
  const ex=state.editCustomEx;
  if(!ex) return;
  document.querySelectorAll('[data-cue]').forEach(el=>{
    const i=parseInt(el.dataset.cue);
    if(ex.formCues) ex.formCues[i]=el.value;
  });
}

function bindCustomExEditor(){
  const ex=state.editCustomEx;
  if(!ex) return;

  document.getElementById('cex-back')?.addEventListener('click',()=>{state.editCustomEx=null;nav('library');});

  // Tag chips — targeted class toggles, no re-render
  document.querySelectorAll('[data-cex-grp]').forEach(el=>el.addEventListener('click',()=>{
    ex.muscleGroup=el.dataset.cexGrp;
    document.querySelectorAll('[data-cex-grp]').forEach(b=>b.classList.toggle('active',b===el));
  }));
  document.querySelectorAll('[data-cex-pat]').forEach(el=>el.addEventListener('click',()=>{
    ex.movementPattern=el.dataset.cexPat;
    document.querySelectorAll('[data-cex-pat]').forEach(b=>b.classList.toggle('active',b===el));
  }));
  document.querySelectorAll('[data-cex-att]').forEach(el=>el.addEventListener('click',()=>{
    ex.attachment=el.dataset.cexAtt;
    document.querySelectorAll('[data-cex-att]').forEach(b=>b.classList.toggle('active',b===el));
  }));

  // Image picker
  document.getElementById('cex-img-pick')?.addEventListener('click',()=>document.getElementById('cex-img-file')?.click());
  document.getElementById('cex-img-file')?.addEventListener('change',e=>{
    const file=e.target.files[0]; if(!file) return;
    const isVideo=file.type.startsWith('video/');
    const reader=new FileReader();
    reader.onload=re=>{
      if(isVideo){ ex.videoFile=re.target.result; ex.gifFile=null; }
      else { ex.gifFile=re.target.result; ex.videoFile=null; }
      const prev=document.getElementById('cex-img-preview');
      if(prev){
        const el=document.createElement(isVideo?'video':'img');
        el.id='cex-img-preview';el.src=re.target.result;
        el.style.cssText='width:80px;height:80px;object-fit:contain;border-radius:var(--radius);background:var(--bg3)';
        if(isVideo){el.autoplay=true;el.muted=true;el.loop=true;el.setAttribute('playsinline','');}
        prev.replaceWith(el);
      }
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('cex-img-clear')?.addEventListener('click',()=>{ex.gifFile=null;ex.videoFile=null;render();});

  // Form cue delete
  document.querySelectorAll('[data-cue-del]').forEach(el=>el.addEventListener('click',()=>{
    syncCustomExCues();
    const i=parseInt(el.dataset.cueDel);
    ex.formCues.splice(i,1);
    if(!ex.formCues.length) ex.formCues=[''];
    render();
  }));

  // Add cue
  document.getElementById('cex-add-cue')?.addEventListener('click',()=>{
    syncCustomExCues();
    ex.formCues.push('');
    render();
    setTimeout(()=>{const inputs=document.querySelectorAll('[data-cue]');inputs[inputs.length-1]?.focus();},50);
  });

  // Favorite toggle
  document.getElementById('cex-fav-row')?.addEventListener('click',()=>{
    ex.favorite=!ex.favorite;
    const icon=document.getElementById('cex-fav-icon');
    if(icon) icon.textContent=ex.favorite?'★':'☆';
  });

  // Save
  document.getElementById('cex-save')?.addEventListener('click',async()=>{
    syncCustomExCues();
    const name=(document.getElementById('cex-name')?.value||'').trim();
    if(!name){showToast('Please enter a name');return;}
    ex.name=name;
    ex.formCues=(ex.formCues||[]).filter(c=>c.trim());
    const isNew=!ex.id;
    if(isNew) ex.id='custom-'+Date.now();
    ex.isCustom=true;
    await dbPut('userEx',ex);
    if(isNew){ EXERCISES.push(ex); }
    else{ const idx=EXERCISES.findIndex(e=>e.id===ex.id); if(idx>=0) EXERCISES[idx]=ex; }
    state.editCustomEx=null;
    showToast(isNew?'Exercise added!':'Exercise saved!');
    nav('library');
  });

  // Delete
  document.getElementById('cex-delete')?.addEventListener('click',()=>{
    showConfirm('Delete exercise?',`"${ex.name}" will be permanently deleted.`,async()=>{
      await dbDelete('userEx',ex.id);
      const idx=EXERCISES.findIndex(e=>e.id===ex.id);
      if(idx>=0) EXERCISES.splice(idx,1);
      ROUTINES.forEach(r=>{r.entries=(r.entries||[]).filter(e=>e.exerciseId!==ex.id);});
      state.editCustomEx=null;
      showToast('Exercise deleted');
      nav('library');
    });
  });
}

async function saveRoutine(){

async function deleteRoutine(){

    await dbDelete('routines',id);
    ROUTINES=ROUTINES.filter(r=>r.id!==id);
    nav('routines');
  });
}

function showExercisePicker(){
  let searchVal='';
  let groupFilter='All';

  function getFiltered(){
    return EXERCISES
      .filter(e=>!searchVal||e.name.toLowerCase().includes(searchVal.toLowerCase()))
      .filter(e=>groupFilter==='All'||e.muscleGroup===groupFilter);
  }

  function updateList(){
    const list=document.getElementById('picker-ex-list');
    if(!list) return;
    const rows=getFiltered().map(e=>`
      <div class="ex-row picker-ex" data-exid="${e.id}">
        ${exMediaEl(e,'ex-gif','width:40px;height:40px')||''}
        <div class="ex-info"><div class="ex-name">${e.name}</div><div class="ex-meta">${e.muscleGroup}</div></div>
      </div>`).join('');
    list.innerHTML=rows||'<div style="padding:16px;text-align:center;color:var(--fg3)">No exercises match.</div>';
    list.querySelectorAll('.picker-ex').forEach(el=>el.addEventListener('click',()=>{
      showExEntryModal(el.dataset.exid); // showModal inside already closes the picker
    }));
  }

  function updateChips(){
    const chips=document.getElementById('picker-chips');
    if(!chips) return;
    chips.innerHTML=GROUPS.map(g=>`<button class="chip ${groupFilter===g?'active':''}" data-grp="${g}">${g}</button>`).join('');
    chips.querySelectorAll('[data-grp]').forEach(el=>el.addEventListener('click',()=>{
      groupFilter=el.dataset.grp; updateChips(); updateList();
    }));
  }

  // Build modal once — search input is never replaced, so focus is never lost
  closeModal();

async function doExport({incLogs=true,incCustom=true,incRoutines=true,incPrograms=true}={}){
  const allUserEx=await dbGetAll('userEx');
  const customEx=allUserEx.filter(u=>u.isCustom);
  const favOverrides=allUserEx.filter(u=>!u.isCustom);
  const data={schema:2,version:'1.0',exportedAt:new Date().toISOString()};
  if(incLogs) data.logs=state.logs;
  if(incCustom) data.customExercises=customEx;
  if(incRoutines) data.routines=ROUTINES.filter(r=>!r.isStarter);
  if(incPrograms) data.programs=PROGRAMS.filter(p=>!p.isStarter);
  data.userExerciseOverrides=favOverrides;
  data.settings=state.settings;
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`tiltboard-backup-${todayStr()}.json`;a.click();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded!');
}

async function importData(file){
  if(!file) return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    if(!data.schema||data.schema<1) throw new Error('Invalid backup file');
    const parts=[];
    if(data.logs?.length) parts.push(`${data.logs.length} logs`);
    if(data.customExercises?.length) parts.push(`${data.customExercises.length} custom exercises`);
    if(data.routines?.length) parts.push(`${data.routines.length} routines`);
    if(data.programs?.length) parts.push(`${data.programs.length} programs`);
    const msg=`Import ${parts.join(', ')||'data'} from ${data.exportedAt?.slice(0,10)||'?'}? Existing matching items will be replaced.`;
    showConfirm('Import Backup?',msg,async()=>{
      // Clear existing user data (only what's present in the file)
      if(data.logs){for(const l of state.logs) if(l.id) await dbDelete('logs',l.id);state.logs=[];}
      if(data.routines){const savedR=await dbGetAll('routines');for(const r of savedR) await dbDelete('routines',r.id);}
      if(data.programs){const savedP=await dbGetAll('programs');for(const p of savedP) await dbDelete('programs',p.id);}
      // Write
      for(const l of (data.logs||[])){const r=await dbPut('logs',l);if(!l.id){l.id=r;}state.logs.push(l);}
      for(const r of (data.routines||[])){await dbPut('routines',r);ROUTINES=ROUTINES.filter(x=>x.id!==r.id);ROUTINES.push(r);}
      for(const p of (data.programs||[])){await dbPut('programs',p);PROGRAMS=PROGRAMS.filter(x=>x.id!==p.id);PROGRAMS.push(p);}
      for(const ce of (data.customExercises||[])){
        await dbPut('userEx',ce);
        const idx=EXERCISES.findIndex(e=>e.id===ce.id);
        if(idx>=0) EXERCISES[idx]=ce; else EXERCISES.push(ce);
      }
      for(const u of (data.userExerciseOverrides||[])){
        if(u.isCustom){const idx=EXERCISES.findIndex(e=>e.id===u.id);if(idx>=0) EXERCISES[idx]=u;else EXERCISES.push(u);}
        else{await dbPut('userEx',u);const ex=EXERCISES.find(e=>e.id===u.id);if(ex)Object.assign(ex,u);}
      }
      if(data.settings){await saveSettings(data.settings);}
      showToast('Import complete!');nav('today');
    });
  }catch(err){showToast('Import failed: '+err.message);}
}

async function forceReload(){
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){console.warn('Cache clear error:',e);}
  location.reload(true);
}

async function resetAll(){
  for(const l of state.logs) if(l.id) await dbDelete('logs',l.id);
  const savedR=await dbGetAll('routines'); for(const r of savedR) await dbDelete('routines',r.id);
  const savedP=await dbGetAll('programs'); for(const p of savedP) await dbDelete('programs',p.id);
  const savedU=await dbGetAll('userEx'); for(const u of savedU) await dbDelete('userEx',u.id);
  state.logs=[];
  ROUTINES=await (await fetch('data/routines.json')).json();
  PROGRAMS=await (await fetch('data/programs.json')).json();
  // Remove custom exercises from memory and reset favorites
  const baseEx=await (await fetch('data/exercises.json')).json();
  EXERCISES.length=0; baseEx.forEach(e=>EXERCISES.push(e));
  state.activeProgram=PROGRAMS[0]?.id||null;
  await dbPut('settings',{id:'main',theme:state.theme,activeProgram:state.activeProgram});
  showToast('All data reset!');nav('today');
}

    }).join('');
    return `<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">
      <div style="padding:16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:18px;font-weight:800;font-family:var(--font-head)">${w.routineName}</div>
          <div id="workout-elapsed" style="font-size:12px;color:var(--fg3);margin-top:3px">⏱ 00:00</div>
        </div>
        <button class="back-btn" id="quit-workout" style="color:var(--red)">Quit</button>
      </div>
      <div style="flex:1;overflow-y:auto;padding:12px 16px">
        <div class="card-section">${exRows}</div>
      </div>
      <div style="padding:16px;border-top:1px solid var(--border);flex-shrink:0">
        <div style="font-size:13px;font-weight:600;color:var(--fg2);margin-bottom:8px">How did it feel?</div>
        <div class="felt-row" style="margin-bottom:12px">${feels.map(([e,l],i)=>`<button class="felt-btn${w.feltLike===(i+1)?' active':''}" data-felt="${i+1}">${e}<br><small>${l}</small></button>`).join('')}</div>
        <button class="btn btn-primary" id="complete-checkoff">✓ Complete Routine</button>
      </div>
    </div>`;
  }

  // ── GUIDED mode: step-by-step, one exercise at a time with GIF + form cues ──
  const entry=w.entries[w.current];
  const ex=EXERCISES.find(e=>e.id===entry?.exerciseId);
  if(!ex) return '';
  const totalEx=w.entries.length;
  const progress=(w.current/totalEx*100).toFixed(0);
  const isLast=w.current+1>=totalEx;
  return `<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">
    <div style="padding:16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div>
          <div style="font-size:13px;color:var(--fg2);font-weight:600">Exercise ${w.current+1} of ${totalEx}</div>
          <div id="workout-elapsed" style="font-size:12px;color:var(--fg3);margin-top:2px">⏱ 00:00</div>
        </div>
        <button class="back-btn" id="quit-workout" style="color:var(--red)">Quit</button>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div style="font-size:20px;font-weight:800;font-family:var(--font-head);margin-top:10px">${ex.name}</div>
      <div style="font-size:13px;color:var(--fg2)">${ex.muscleGroup} · ${entry.sets} sets × ${entry.reps} reps · incline ${entry.targetIncline}</div>
    </div>
    <div style="flex:1;overflow-y:auto;padding:16px">
      ${exMediaEl(ex,null,'width:100%;max-height:260px;object-fit:contain;border-radius:var(--radius);background:var(--bg3);margin-bottom:16px')||''}
      ${ex.formCues.map((c,ci)=>`<div class="cue-item"><div class="cue-num">${ci+1}</div><div>${c}</div></div>`).join('')}
    </div>
    <div style="padding:16px;border-top:1px solid var(--border);flex-shrink:0;display:flex;gap:10px">
      ${w.current>0?`<button class="btn btn-secondary" id="guided-back" style="width:auto;padding:13px 18px">←</button>`:''}
      <button class="btn btn-primary" id="guided-next" style="flex:1">
        ${isLast?'✓ Done — Complete Routine':'✓ Done — Next Exercise →'}
      </button>
    </div>
  </div>`;
}

function bindWorkout(){
  clearInterval(_workoutTimer);
  const elapsedEl=()=>document.getElementById('workout-elapsed');
  const tick=()=>{
    const el=elapsedEl(); if(!el||!state.workout) return;
    const s=Math.floor((Date.now()-state.workout.durationStart)/1000);
    const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
    el.textContent='⏱ '+(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(sec).padStart(2,'0');
  };
  tick();
  _workoutTimer=setInterval(tick,1000);
  const stopTimer=()=>clearInterval(_workoutTimer);
  document.getElementById('quit-workout')?.addEventListener('click',()=>showConfirm('Quit workout?','Your progress will be lost.',()=>{stopTimer();state.workout=null;nav('today');}));
  // Checkoff mode: checkbox toggles (targeted DOM update — no full re-render needed)
  document.querySelectorAll('[data-chk-btn]').forEach(el=>el.addEventListener('click',()=>{
    const i=parseInt(el.dataset.chkBtn);
    state.workout.checked[i]=!state.workout.checked[i];
    const done=state.workout.checked[i];
    el.textContent=done?'✓':'';
    el.classList.toggle('checked',done);
    const row=document.querySelector(`[data-chk-row="${i}"]`);
    if(row) row.classList.toggle('checkoff-done',done);
  }));
  // Checkoff mode: felt picker (toggle active class without re-render)
  document.querySelectorAll('[data-felt]').forEach(el=>el.addEventListener('click',()=>{
    state.workout.feltLike=parseInt(el.dataset.felt);
    document.querySelectorAll('[data-felt]').forEach(b=>b.classList.toggle('active',b===el));
  }));
  // Checkoff mode: complete routine
  document.getElementById('complete-checkoff')?.addEventListener('click',async()=>{
    const w=state.workout;
    const durationSec=Math.round((Date.now()-w.durationStart)/1000);
    const log={date:todayStr(),routineId:w.routineId,routineName:w.routineName,mode:'checkoff',sets:[],durationSec,feltLike:w.feltLike||2};
    const id=await dbPut('logs',log);log.id=id;
    state.logs.push(log);stopTimer();state.workout=null;showToast('Workout logged! 🎉');nav('today');
  });
  // Guided mode: advance step-by-step, show end screen when done
  document.getElementById('guided-next')?.addEventListener('click',()=>{
    const w=state.workout;
    w.current++;
    if(w.current>=w.entries.length) renderGuidedComplete();
    else render();
  });
  document.getElementById('guided-back')?.addEventListener('click',()=>{
    state.workout.current--;
    render();
  });
}

// ── Guided workout end screen (replaces entire #view content) ──
function renderGuidedComplete(){
  const w=state.workout;
  const feels=[['😊','Easy'],['💪','Medium'],['😤','Hard'],['🔥','Intense'],['🏆','PR Day!']];
  document.getElementById('view').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:32px 24px">
      <div style="font-size:56px;margin-bottom:12px">🏆</div>
      <div style="font-size:26px;font-weight:800;font-family:var(--font-head);margin-bottom:6px">All Done!</div>
      <div style="color:var(--fg2);margin-bottom:28px;font-size:15px">${w.entries.length} exercise${w.entries.length!==1?'s':''} completed</div>
      <div style="font-size:14px;font-weight:600;color:var(--fg2);margin-bottom:10px">How did it feel?</div>
      <div class="felt-row" style="width:100%;max-width:340px">${feels.map(([e,l],i)=>`<button class="felt-btn ${i===1?'active':''}" data-felt="${i+1}">${e}<br><small>${l}</small></button>`).join('')}</div>
      <div style="width:100%;max-width:340px;margin-top:24px">
        <button class="btn btn-primary" id="complete-routine">✓ Complete Routine</button>
        <button class="btn btn-secondary" id="quit-workout" style="margin-top:8px">Discard</button>
      </div>
    </div>`;
  document.querySelectorAll('[data-felt]').forEach(el=>el.addEventListener('click',()=>{
    w.feltLike=parseInt(el.dataset.felt);
    document.querySelectorAll('[data-felt]').forEach(b=>b.classList.toggle('active',b===el));
  }));
  document.getElementById('complete-routine')?.addEventListener('click',async()=>{
    const durationSec=Math.round((Date.now()-w.durationStart)/1000);
    const log={date:todayStr(),routineId:w.routineId,routineName:w.routineName,mode:'guided',sets:[],durationSec,feltLike:w.feltLike||2};
    const id=await dbPut('logs',log);log.id=id;
    state.logs.push(log);clearInterval(_workoutTimer);state.workout=null;showToast('Workout logged! 🎉');nav('today');
  });
  document.getElementById('quit-workout')?.addEventListener('click',()=>showConfirm('Discard workout?','Progress will not be saved.',()=>{clearInterval(_workoutTimer);state.workout=null;nav('today');}));
}


// ─── MODAL / TOAST HELPERS ───────────────────────────
function showModal(title,content){
  closeModal();
  const backdrop=document.createElement('div');
  backdrop.className='modal-backdrop';backdrop.id='modal-backdrop';
  backdrop.innerHTML=`<div class="modal-sheet"><div class="modal-title">${title}</div>${content}</div>`;
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal();});
  document.body.appendChild(backdrop);
}

function showModal2(renderFn,sheetId){
  closeModal();
  const backdrop=document.createElement('div');
  backdrop.className='modal-backdrop';backdrop.id='modal-backdrop';
  backdrop.innerHTML=`<div class="modal-sheet" id="${sheetId}"></div>`;
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal();});
  document.body.appendChild(backdrop);
  renderFn();
}

function closeModal(){document.getElementById('modal-backdrop')?.remove();}

function showConfirm(title,msg,onConfirm){
  showModal(title,`<p style="color:var(--fg2);margin-bottom:20px">${msg}</p>
    <button class="btn btn-danger" id="confirm-yes" style="width:100%;margin-bottom:8px">Confirm</button>
    <button class="btn btn-secondary" id="confirm-no" style="width:100%">Cancel</button>`);
  setTimeout(()=>{
    document.getElementById('confirm-yes')?.addEventListener('click',()=>{closeModal();onConfirm();});
    document.getElementById('confirm-no')?.addEventListener('click',closeModal);
  },50);
}

let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

// ─── Bootstrap ───────────────────────────────────────
document.addEventListener('DOMContentLoaded',init);
</script>
